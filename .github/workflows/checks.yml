# The checks that run on every push and pull request.
#
# Carried from the Application Requirement Ontology, minus its corpus
# index step: the index is an APQC navigation aid, and the BCO has no
# corpus large enough to need one yet.
#
# Deliberately small to begin with. A workflow that runs everything from
# day one is a workflow whose failures nobody reads; this runs the
# contract, the licensing classification and the suite, and grows as the
# checks do.
#
# Actions are pinned to commit SHAs. A tag can be moved to a different
# commit; a commit cannot. Everything else in this repository pins
# exactly, and a supply chain is a strange place to make an exception.
#
# fetch-depth is 0 because history-dependent checks are expected to
# arrive -- comparing an artifact against the commit it describes needs
# more than the tip. It is cheap here and painful to discover missing.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the one job that needs the network. Nothing here should
    # change on its own -- the upstream urls name commits -- so a failure
    # is a real finding: a moved artifact, a rewritten history, or a
    # repository that has gone away. BPO is one of the three, and it is
    # the one most likely to be rewritten.
    - cron: '19 6 * * 1' 

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contract, licensing, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip list

      - name: The layout contract describes the tree
        run: python tools/layout.py

      - name: Every tracked file has exactly one disposition
        run: python tools/licensing/disposition.py

      - name: Nothing unpublishable is tracked
        run: python tools/licensing/disposition.py --check

      - name: The vendored extracts cover what the shapes walk
        run: python tools/ontology/vendor_upstream.py

      # The SHACL ladder, gated against config/validation-baseline.json.
      # This is the check that says "no new findings" -- the ontology has
      # known defects and this is what stops them growing. Running it here
      # costs a second full ladder pass, because a test may not read build
      # output and so the two cannot share a report.
      - name: No new ontology findings
        run: python tools/ontology/validate.py --gate

      - name: The communications record follows its protocol
        run: python tools/communications.py

      - name: The citation register keeps its rules and is a fresh generation
        run: python tools/sources/build_register.py

      # ADR-003's checks over the authored vocabulary, and the committed
      # Turtle compared with a fresh build. Needs full history: a
      # ratification act is cited by a commit that must be reachable from
      # origin/main (D2), which is why fetch-depth is 0 above.
      - name: The vocabulary builds, and the committed Turtle is fresh
        run: python tools/vocab/build.py

      # The Stage 02 standard, section 7: automated checks may verify
      # documentation completeness, internal references and consistency.
      # Conceptual adequacy is a human review, and not this step's question.
      - name: Every conceptual model meets its format contract
        run: python tools/conceptual/check_models.py

      # Offline: the committed Mermaid bundle and licence against their
      # pinned sha256, and the notice against a fresh generation.
      - name: The vendored site assets match their pins
        run: python tools/site/vendor_assets.py

      - name: Tests
        run: python -m pytest tests/ -q -p no:randomly

  vocab-schema:
    # LinkML, go-limited (docs/decisions/2026-10-24-p2-linkml-signoff.md):
    # gen-json-schema regenerated and compared byte for byte with the
    # committed config/vocab-schema.json, and linkml validate over the
    # authored vocabulary YAML and over cases built to break the schema.
    #
    # A job of its own because its environment is 91 packages, against
    # the main job's handful. requirements-dev.txt and the main suite
    # stay free of LinkML; tests/test_vocab.py requires that. The pip
    # cache is keyed on requirements-vocab.txt, so a cold install (over
    # ten minutes in the P2 trial) is paid when the pin changes, not on
    # every run.
    name: Vocabulary schema (LinkML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-vocab.txt

      - name: Install the pinned LinkML environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vocab.txt
          python -m pip check
          python -m pip freeze

      - name: gen-json-schema is fresh; linkml validate accepts the vocabulary and refuses the broken cases
        run: python tools/vocab/schema_check.py

  vendored:
    # The check the offline one cannot make: that the committed extracts
    # are what rebuilding from the pinned upstreams produces, rather than
    # files that were once generated and have been edited since.
    #
    # Separate because it needs the network. Folding it into the job
    # above would make every pull request depend on three external hosts
    # being up, and a check that fails for reasons unrelated to the
    # change is a check people learn to re-run rather than read.
    name: Extracts still rebuild from the pinned sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Fetch the pinned upstreams and compare
        run: python tools/ontology/vendor_upstream.py --confirm
