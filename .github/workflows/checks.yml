# The checks that run on every push and pull request.
#
# Carried from the Application Requirement Ontology, minus its corpus
# index step: the index is an APQC navigation aid, and the BCO has no
# corpus large enough to need one yet.
#
# Deliberately small to begin with. A workflow that runs everything from
# day one is a workflow whose failures nobody reads; this runs the
# contract, the licensing classification and the suite, and grows as the
# checks do.
#
# Actions are pinned to commit SHAs. A tag can be moved to a different
# commit; a commit cannot. Everything else in this repository pins
# exactly, and a supply chain is a strange place to make an exception.
#
# fetch-depth is 0 because history-dependent checks are expected to
# arrive -- comparing an artifact against the commit it describes needs
# more than the tip. It is cheap here and painful to discover missing.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, for the one job that needs the network. Nothing here should
    # change on its own -- the upstream urls name commits -- so a failure
    # is a real finding: a moved artifact, a rewritten history, or a
    # repository that has gone away. BPO is one of the three, and it is
    # the one most likely to be rewritten.
    - cron: '19 6 * * 1' 

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contract, licensing, tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip list

      - name: The layout contract describes the tree
        run: python tools/layout.py

      - name: Every tracked file has exactly one disposition
        run: python tools/licensing/disposition.py

      - name: Nothing unpublishable is tracked
        run: python tools/licensing/disposition.py --check

      - name: The vendored extracts cover what the shapes walk
        run: python tools/ontology/vendor_upstream.py

      # The SHACL ladder, gated against config/validation-baseline.json.
      # This is the check that says "no new findings" -- the ontology has
      # known defects and this is what stops them growing. Running it here
      # costs a second full ladder pass, because a test may not read build
      # output and so the two cannot share a report.
      - name: No new ontology findings
        run: python tools/ontology/validate.py --gate

      - name: The communications record follows its protocol
        run: python tools/communications.py

      - name: The citation register keeps its rules and is a fresh generation
        run: python tools/sources/build_register.py

      # ADR-003's checks over the authored vocabulary, and the committed
      # Turtle compared with a fresh build. Needs full history: a
      # ratification act is cited by a commit that must be reachable from
      # origin/main (D2), which is why fetch-depth is 0 above.
      - name: The vocabulary builds, and the committed Turtle is fresh
        run: python tools/vocab/build.py

      # The Stage 02 standard, section 7: automated checks may verify
      # documentation completeness, internal references and consistency.
      # Conceptual adequacy is a human review, and not this step's question.
      - name: Every conceptual model meets its format contract
        run: python tools/conceptual/check_models.py

      # Offline: the committed Mermaid bundle and licence against their
      # pinned sha256, and the notice against a fresh generation.
      - name: The vendored site assets match their pins
        run: python tools/site/vendor_assets.py

      # Offline: the Capability Term Inventory's outputs against their
      # pinned input digests, the APQC withholding rule, the admission
      # guard (no RDF, no authored-namespace IRI) and a fresh notice.
      - name: The inventory keeps its pins, its rights rule and its admission guard
        run: python tools/inventory/harvest_bpo.py

      # Offline: the I-2a rights review -- every piece of evidence pinned
      # by digest, no catalog content, quotes within 15 words, a gap
      # reason wherever a source is not complete, the admission guard.
      - name: The rights review keeps its pins and writes no catalog content
        run: python tools/inventory/rights.py

      # Offline: the I-2c federal catalogs (FEAF-II BRM, FIBF) -- digests
      # against rights.yaml, the snapshot of every pinned FIBF document,
      # nothing from a MITRE-marked workbook, no third-party mapping text,
      # a locator and (for FIBF capabilities) a homonym flag on every
      # entry, a fresh notice, the admission guard.
      - name: The federal inventory keeps its pins, its rights posture and its admission guard
        run: python tools/inventory/harvest_federal.py

      # Offline: the I-2b PCF entries and the repository-root NOTICE.md --
      # the generator's form, APQC's notice by its pinned digest, the
      # header the pins and the decision give, consistent entries, BPO's
      # bridge as the committed I-1 file gives it, a fresh NOTICE.md and
      # the admission guard. CI has no copy of BPO's files, so the
      # byte-for-byte rebuild is the weekly job's.
      - name: The PCF entries keep their pins, their notice and their form
        run: python tools/inventory/harvest_pcf.py

      # Offline: Phase I-4, the Candidate Capability Catalog -- regenerated
      # from the committed inventories and act types, byte for byte, with
      # its consistency checks and the admission guard.
      - name: The candidate catalog is the generator's output and passes its checks
        run: python tools/catalog/synthesize.py

      # The decision of 2026-10-29, section 4: every tracked file that
      # carries PCF material carries APQC's notice (or has a recorded
      # exception), and NOTICE.md lists exactly those files.
      - name: Every PCF-bearing file carries APQC's notice
        run: python tools/licensing/pcf_notice.py

      # Stage 05 (D6): the capability module is what its tranche record
      # produces, and every field of the record agrees with the readiness
      # package, the signed G1-T records and the vocabulary build (S05-T1).
      - name: The capability and description modules are their tranche records' builds
        run: python tools/ontology/formalize.py

      # Gate M (decision of 2026-11-15, B-2): the CD15 completeness
      # manifest schema, and every fixture manifest built to pass or fail.
      - name: Gate M, the completeness manifests match the CD15 schema
        run: python tools/ontology/manifests.py

      # Stage 06 register data (S06-A1, S06-R1, S06-R2, S06-MG): the scope
      # audit and the coverage register are their reviewed inputs' builds,
      # the register matches its schema, and the bc: migration keeps its rules.
      - name: Stage 06 register data are their inputs' builds and keep their rules
        run: python tools/kg/register.py

      # S05-D: ELK over the modules and extracts through the pinned ROBOT
      # jar, falsified by a case built to be unsatisfiable. The jar is
      # cached by its SHA-256 and fetched only on a miss; --fetch refuses
      # bytes that are not the pinned ones. HermiT (S05-D2) runs too: it is
      # cheap at this size, and a checkpoint needs its result.
      - name: Cache the pinned ROBOT jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools-cache
          key: robot-53cd275c8e4c0dad1fc2c1c34174876795cd7d6b6926e1444adcbb0cb3c7ab26

      - name: The reasoners classify the module (ELK and HermiT)
        run: python tools/ontology/reason.py --fetch --checkpoint

      - name: Tests
        run: python -m pytest tests/ -q -p no:randomly

  vocab-schema:
    # LinkML, go-limited (docs/decisions/2026-10-24-p2-linkml-signoff.md):
    # gen-json-schema regenerated and compared byte for byte with the
    # committed config/vocab-schema.json, and linkml validate over the
    # authored vocabulary YAML and over cases built to break the schema.
    #
    # A job of its own because its environment is 91 packages, against
    # the main job's handful. requirements-dev.txt and the main suite
    # stay free of LinkML; tests/test_vocab.py requires that. The pip
    # cache is keyed on requirements-vocab.txt, so a cold install (over
    # ten minutes in the P2 trial) is paid when the pin changes, not on
    # every run.
    name: Vocabulary schema (LinkML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-vocab.txt

      - name: Install the pinned LinkML environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vocab.txt
          python -m pip check
          python -m pip freeze

      - name: gen-json-schema is fresh; linkml validate accepts the vocabulary and refuses the broken cases
        run: python tools/vocab/schema_check.py

  vendored:
    # The check the offline one cannot make: that the committed extracts
    # are what rebuilding from the pinned upstreams produces, rather than
    # files that were once generated and have been edited since.
    #
    # Separate because it needs the network. Folding it into the job
    # above would make every pull request depend on three external hosts
    # being up, and a check that fails for reasons unrelated to the
    # change is a check people learn to re-run rather than read.
    #
    # Since Stage 06 (docs/standards/stage-06-knowledge-graph.md, S06-U1
    # and S06-U2) this job holds only what comes from the ontology pins and
    # BPO. The federal rights documents have their own job below, so that
    # a moved government web page cannot hide, or be hidden by, an upstream
    # ontology result. Neither job is weakened: each runs every step it ran.
    name: Extracts still rebuild from the pinned sources
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # S06-U1: every pinned upstream file is refetched and its digest
      # verified, and the committed extracts are rebuilt and compared.
      - name: Fetch the pinned upstreams and compare
        run: python tools/ontology/vendor_upstream.py --confirm

      # S06-U2: ELK and HermiT over the BCO modules with the complete BFO
      # and CCO at their pins (BPO as its extract, the import boundary),
      # each run falsified; the closure loaded and the results are printed.
      - name: Cache the pinned ROBOT jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools-cache
          key: robot-53cd275c8e4c0dad1fc2c1c34174876795cd7d6b6926e1444adcbb0cb3c7ab26

      - name: The reasoners over the complete pinned BFO and CCO (S06-U2)
        run: python tools/ontology/reason.py --fetch --complete

      # The same question for the inventory: are the committed outputs what
      # harvesting BPO at the pinned commits (and the baseline) produces?
      # Fetches from raw.githubusercontent.com only, sharing the cache above.
      - name: Harvest BPO at the pinned commits and compare
        run: python tools/inventory/harvest_bpo.py --confirm

      # And for I-2b: do BPO's catalog and NOTICE.md at the pinned commit
      # still build the committed PCF entries and NOTICE.md byte for byte?
      # Fetches from raw.githubusercontent.com at the pinned commit only;
      # nothing is ever fetched from apqc.org.
      - name: Rebuild the PCF entries and NOTICE.md from BPO and compare
        run: python tools/inventory/harvest_pcf.py --confirm

  federal:
    # The rights review's pinned documents, refetched from the rights
    # holders. A moved digest is a new edition for the architect to review,
    # not something to re-pin silently. Network-bound like the job above,
    # and run on the same schedule.
    name: Rights documents are still served as pinned
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Fetches from obamawhitehouse.archives.gov, ussm.gsa.gov,
      # www.gsa.gov and raw.githubusercontent.com only; apqc.org is never
      # fetched.
      - name: Refetch the rights review's pinned documents and compare
        run: python tools/inventory/rights.py --confirm

      # And for I-2c: are the federal inventory's outputs what harvesting
      # the refetched documents produces, byte for byte? Fetches from
      # ussm.gsa.gov, www.gsa.gov and obamawhitehouse.archives.gov only, never from a
      # cache; also checks that no harvested text equals a MITRE-marked
      # workbook's, which needs those workbooks' bytes.
      - name: Harvest the federal catalogs from the refetched documents and compare
        run: python tools/inventory/harvest_federal.py --confirm
