# Pins and posture of the Capability Term Inventory's APQC PCF material
# (Phase I-2b): the PCF 7.4, Cross-Industry, as the Business Process
# Ontology (BPO) carries it.
#
# Read by tools/inventory/harvest_pcf.py, which writes the outputs named
# here; by tools/licensing/pcf_notice.py, the gate that refuses a
# PCF-bearing file without APQC's notice; and by
# tools/licensing/disposition.py, which reads the licence and attribution
# of the entries file from here (as it reads config/inventory-sources.yaml
# for Phase I-1).
#
# THE AUTHORITY
#
# docs/decisions/2026-10-29-apqc-pcf-sourcing-decided.md. The architect
# replaced APQC-1 (citation only) with this: PCF 7.4 element IDs,
# hierarchy IDs, names and descriptions may be published, taken only from
# BPO's repository at a pinned commit that carries BPO's NOTICE.md, with
# APQC's notice -- copied from that file, not retyped, its digest recorded
# -- on every PCF-bearing artifact, and a check that fails when one lacks
# it. Nothing is ever fetched from apqc.org.
#
# WHY A FILE OF ITS OWN
#
# The PCF workbook pin in config/inventory-sources.yaml is Phase I-1's,
# and that file is an approved I-1 output recorded by digest
# (docs/decisions/2026-10-27-inventory-i1-approved.md), so I-2b does not
# edit it -- the same reason I-2c pinned its federal sources beside it.
# config/upstream-sources.yaml pins BPO for the vendored apqc-ext.ttl
# extract, which only the architect's re-pin process moves; this pin is
# not that one either.
#
# WHAT IS PINNED, AND HOW
#
# BPO commit 2e55edd, the first commit that carries BPO's NOTICE.md (and
# BPO's head on 2026-10-29): the earliest the decision admits. Two files,
# each by sha256 of its bytes, fetched only from raw.githubusercontent.com
# at the commit and cached under .upstream-cache/ (gitignored, never
# committed):
#
#   ontology/apqc-catalog.ttl  every PCF 7.4 element as a SKOS concept
#                              with bpo:pcfID, bpo:hierarchyID,
#                              skos:prefLabel, bpo:apqcSourceText and
#                              skos:broader; its ontology header's
#                              dct:rights is BPO's framing sentence, a
#                              blank line, and APQC's notice.
#   NOTICE.md                  BPO's notice file; APQC's notice is the
#                              blockquote under "## APQC's notice".
#
# `apqc_notice_sha256` is the sha256 (UTF-8) of APQC's notice as the tool
# extracts it from that blockquote, its `> ` lines unwrapped into one
# paragraph. The tool refuses unless the extraction digests to it and is
# equal to the APQC part of the catalog's dct:rights at the same commit.
# It was measured, not typed from the notice: the notice's text exists in
# this repository only as the tool's copy of it.
#
# PCF-BEARING FILES, AND EXCEPTIONS
#
# `pcf_bearing` lists every tracked file that carries PCF material, with
# what it carries; NOTICE.md at the repository root is generated from it,
# and tools/licensing/pcf_notice.py requires it to be exactly the set of
# tracked files the gate finds carrying PCF content. Each must carry the
# notice, except a file in `exceptions`, which names its reason.
#
# `exceptions` is empty. Until E7 it held Phase I-1's bpo-entries.yaml,
# "awaits E7": an I-1 output, approved by digest before the decision of
# 2026-10-29, that only the E7 pull request could change. E7 has added the
# notice to it, so the list is empty, and a test pins it empty: a new
# exception is a new decision, not a line added here.
#
# E7: LIFTING PHASE I-1'S WITHHOLDING
#
# `i1_release` (on the source below) is what tools/inventory/harvest_bpo.py
# reads to release the labels and definitions Phase I-1 withheld as
# `apqc-terms-unverified`: decision E7 of
# docs/decisions/2026-10-28-i2-and-bpo-repin-decided.md, prepared under
# section 5 of the decision of 2026-10-29. The record of what changed is
# docs/sources/inventory/e7-release.md.
# Section 3 of that decision takes all PCF material from BPO at a pinned
# commit that carries BPO's NOTICE.md, so the released text is read at
# this source's commit -- the same commit, NOTICE.md and notice digest as
# the catalog -- and not at I-1's harvest commit bc64e91, which predates
# BPO's NOTICE.md. `modules` pins, by sha256 at that commit, each BPO
# module that declares a withheld class: every withheld declaration I-1
# recorded is in one of them, and the tool refuses one that is not. Each
# module's ontology header carries APQC's notice in its dct:rights, and
# the tool requires that too. The tool releases a text only when it is,
# literal for literal, the text I-1 withheld at bc64e91; a difference is
# a refusal, because releasing changed text would be a new harvest, not
# a lift. Kept here rather than in config/inventory-sources.yaml, which is
# an approved I-1 output recorded by digest and is unchanged by E7.

