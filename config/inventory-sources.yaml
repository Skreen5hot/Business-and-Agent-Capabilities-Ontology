# Pinned sources of the Capability Term Inventory, and what may be done
# with what is harvested from them.
#
# The inventory (docs/sources/inventory/) is source evidence: what other
# projects say a capability is, recorded entry by entry with where each
# one came from. It is not vocabulary and not an admission to the
# ontology (scope approval D6, Amendment 4). Phase I-1 harvests one
# source, the Business Process Ontology (BPO); tools/inventory/harvest_bpo.py
# reads this file, and nothing else says which bytes the inventory was
# built from.
#
# WHY PINNED TO A COMMIT, AND A DIFFERENT ONE FROM THE VENDORED EXTRACT
#
# The approval (D1) harvests BPO `main` HEAD resolved to an immutable
# commit, and compares it with the commit config/upstream-sources.yaml
# already pins for the vendored apqc-ext.ttl extract. Re-pinning that
# extract is a separate decision, so the two pins live in two files: this
# one moves when the inventory is re-harvested, that one only when the
# architect re-pins the extract. A branch name would let the inventory
# change with no commit in this repository, which is the failure a pin
# exists to prevent.
#
# WHY A DIGEST FOR EVERY FILE
#
# The raw URLs below name the commit, so what they serve cannot change.
# The digests are checked anyway, on every fetch and every cache read: a
# proxy, a TLS appliance or a truncated download serves different bytes
# from the same URL and none of them announces it. Per file rather than
# per commit because the harvest reads 21 files out of a much larger
# tree, and a digest over "the commit" would be a claim about bytes the
# tool never opened. The generated outputs record the digests they were
# built from, and the offline check requires those to equal the pins
# here, so an output built from anything else is a refusal.
#
# The baseline's inputs are pinned the same way, because its counts are
# recalculated from its own files rather than copied from an earlier
# report. Its apqc-ext.ttl digest must equal the vendored extract's pin
# in config/upstream-sources.yaml, which is what ties "the baseline" to
# the commit this repository actually vendors.
#
# THE NAMESPACE MAPPING
#
# BPO v0.4.0 moved every IRI from the http://example.org/apqc base to
# https://fandaws.com/ontology/bpo with local names unchanged; v0.4.1
# renamed the prefix label ex: -> bpo: with no IRI change (BPO ADR-002, at
# the selected commit, pinned below as evidence). The baseline is harvested
# as it stands and then rewritten by that one base substitution before it
# is compared, so the diff shows what changed in content rather than the
# move itself.
#
# LICENSING
#
# Two rightsholders, recorded separately (Amendment 3). BPO's own text is
# MIT, read from its LICENSE at the selected commit. Much of BPO is derived
# from the APQC Process Classification Framework, whose conditions BPO's
# MIT licence cannot waive. The APQC evidence BPO carries is pinned below;
# what it permits is Phase I-2's question, so until then every literal the
# harvest identifies as PCF text is withheld from the outputs (the rule is
# in the generator's docstring and docs/sources/inventory/README.md). IRIs
# and PCF codes are kept: they are identifiers, and the entries need them.
#
# The CCO and BFO files the harvest reasons over (to decide what reaches
# Organization Capability and Planned Act) are the pins in
# config/upstream-sources.yaml, fetched to the same cache; nothing from them
# is written to the outputs except IRIs.

version: 1

