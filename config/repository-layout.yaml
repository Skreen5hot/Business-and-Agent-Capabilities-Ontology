# Repository layout contract.
#
# One declaration per component, addressed by a logical id. Everything that
# needs a path asks this file for it, so moving a file is a change here
# rather than an edit across twenty modules.
#
# Carried from the Application Requirement Ontology with its tooling. Ids
# are stable: a scope marker in a query, a group name in a report, or a
# reference from a test survives relocation untouched.
#
# `role` is what a component *is*, and it carries consequences. A
# `generated-artifact` is not hand-edited. A `third-party-reference` is
# never redistributed. A `test-fixture` is expected to be invalid on
# purpose and must not be loaded as if it were part of the ontology. A
# `specification` is read by the vendoring tool for the upstream terms
# the design names. A `historical-draft` is preserved, and never loaded.
#
# A `generated-artifact` must name the `generator` that writes it, or
# declare itself `orphaned` with the reason. In ARO that field exists
# because three components claimed to be regenerated while the tools that
# wrote them were not in the repository. Nothing here is orphaned, and the
# test that pins the orphan list keeps it that way unless a commit says
# otherwise.
#
# Adding a file to the repository without declaring it here is a test
# failure, in both directions: an undeclared file has no stated role, and
# a declared component whose path does not exist is a contract describing
# something that is not there.

version: 1

components:

  # ---- Development stages (src/) -----------------------------------
  #
  # The six stages the architect adopted on 2026-10-25
  # (docs/decisions/2026-10-25-stage-02-choices.md). Each stage directory
  # holds a README stating its status; the stages with content declare
  # their files in the sections below by id, so moving a stage is a change
  # of path here and nowhere else.

  - id: stage.01-controlled-vocabulary.readme
    path: src/01_controlled_vocabulary/README.md
    role: documentation
    description: Stage 01 (Controlled Vocabulary) -- its status and contents.

  - id: stage.02-conceptual-models.readme
    path: src/02_conceptual_models/README.md
    role: documentation
    description: Stage 02 (Conceptual Modeling) -- its status and contents.

  - id: conceptual-models
    path: src/02_conceptual_models
    role: conceptual-model
    description: >-
      The Stage 02 conceptual models, one file each, named
      CM-<nn>-<words>.md (CM-01, the Business Capability Conceptual Domain
      Model, is the first). A directory component, so a model is declared
      the day it is written; the README above is declared on its own and
      keeps its role. tools/conceptual/check_models.py holds every model
      to the documentation-completeness and internal-reference contract
      (standard section 7) and refuses any other file here. Rendered on the
      site's Models page. Content under the project licence.

  - id: tool.check-models
    path: tools/conceptual/check_models.py
    role: tool
    description: >-
      Checks every conceptual model for the standard's required sections,
      diagram-to-text consistency (every node a described concept, every
      edge a described relationship, no orphans), traceability to the
      specification's competency questions, decision points and approval
      state, and upstream and vocabulary tokens against what is vendored
      and generated. Conceptual adequacy is human; this is the part a tool
      can hold.

  - id: stage.03-taxonomy.readme
    path: src/03_taxonomy/README.md
    role: documentation
    description: Stage 03 (Taxonomy) -- its status; nothing here yet.

  - id: stage.04-thesaurus.readme
    path: src/04_thesaurus/README.md
    role: documentation
    description: Stage 04 (Thesaurus) -- its status; nothing here yet.

  - id: stage.05-ontology.readme
    path: src/05_ontology/README.md
    role: documentation
    description: Stage 05 (Ontology) -- its status and contents.

  - id: stage.06-knowledge-graph.readme
    path: src/06_knowledge_graph/README.md
    role: documentation
    description: Stage 06 (Knowledge Graph) -- its status; nothing here yet.

  # ---- Authored ontology -------------------------------------------
  #
  # Stage 05, in src/05_ontology/ (ontology/ until 2026-10-25).
  #
  # The two modules specification v0.4 section 2 names. Both are an
  # owl:Ontology header and nothing else until ADR-002 is ratified. They
  # are declared now so that the first term written into either is in
  # the corpus digest and under the wellformedness shapes on the commit
  # that adds it.

  - id: ontology.cap
    path: src/05_ontology/apqc-cap.ttl
    role: ontology-module
    description: >-
      The capability module: Business Capability, the capability classes
      with their realization index, reviewed unions. Empty; specified, not
      written.

  - id: ontology.cap-desc
    path: src/05_ontology/apqc-cap-desc.ttl
    role: ontology-module
    description: >-
      The description module: the seven description-layer classes and the
      Authorization Record. Empty; specified, not written.

  # ---- Validation ---------------------------------------------------

  - id: validation.wellformedness
    path: shapes/wellformedness_shapes.ttl
    role: ontology-validation
    description: >-
      Well-formedness of an authored term, whatever module it lives in:
      a label and a definition on every class, a prefLabel on every
      concept, and no two values of either in the same language. Carried
      from ARO. Targets authored namespaces only -- classes in bco#,
      concepts in bco-metamodel# and bco-catalog# (ADR-003 D1) -- so the
      vendored extracts in the same data graph are never asked the
      question, and source records and agents are left to the vocabulary
      shapes. The
      spec's CAP shapes (section 2: "CAP shapes beside the existing ones")
      arrive as their own component, each with a negative fixture in the
      same commit.

  - id: validation.vocabulary
    path: shapes/vocabulary_shapes.ttl
    role: ontology-validation
    description: >-
      The controlled vocabulary's SHACL (ADR-003; P4), hand-written because
      LinkML's gen-shacl was no-go in P2: concepts in bco-metamodel# and
      bco-catalog# (one scheme, the right one; tagged prefLabels, one per
      language; a definition; a designated class; a typed notation; no
      stored narrower; a derived status; deprecation iff replacement),
      source references, source records, declared agents and ratification
      references. Every constraint has an sh:message, and every message is
      listed by name in tests/test_ontology_checks.py.

  # ---- Deliberately invalid ------------------------------------------

  - id: fixture.wellformedness-bad-examples
    path: shapes/wellformedness_bad_examples.ttl
    role: test-fixture
    description: >-
      Cases built to break wellformedness_shapes.ttl, with positive
      controls beside them -- including the multilingual label pair that
      sh:maxCount 1 would have rejected, so the false positive is a test
      rather than something somebody remembers.

  - id: fixture.vocabulary-bad-examples
    path: shapes/vocabulary_bad_examples.ttl
    role: test-fixture
    description: >-
      Cases built to break vocabulary_shapes.ttl, one named for each
      constraint, with positive controls -- a metamodel concept, catalog
      concepts that are ratified, deprecated and departing from a source,
      source records and agents -- that must survive. Loaded alone, so it
      declares its own agents and source records; never ontology.

  # ---- Specification and review --------------------------------------

  - id: spec.current
    path: specifications/Business-Capability-Ontology-v0.4.0-draft.1.md
    role: specification
    description: >-
      BCO specification v0.4.0-draft.1 (2026-10-22): seventeen design
      decisions CD1-CD17, the ratification points RP-n, and the module
      layout this repository follows. DRAFT -- nothing in it is normative
      until the architect ratifies it. The vendoring tool reads it for
      the cco:, obo: and ex: terms it names.

  - id: spec.v0.3
    path: specifications/Business-Capability-Ontology-v0.3.0-draft.1.md
    role: documentation
    description: >-
      Superseded by v0.4.0-draft.1; kept for design provenance. Not a
      `specification`, so it does not seed the vendored extracts.

  - id: reviews
    path: reviews
    role: documentation
    description: >-
      Review findings against the specification and the artifacts, each
      filed verbatim as received: R5 (v0.4 against the v0.1 package), R6
      (the P5 vocabulary as published), R7 (the five generated
      vocabulary Turtle files after R6), R8 (conceptual model CM-01,
      draft.1) and R9 (CM-01 draft.4). R<n>-disposition.md is the
      project's proposed disposition of review R<n>. Recommendations and
      proposals, not ratified changes. All are rendered on the site's
      Reviews page.

  # ---- Historical draft ------------------------------------------------

  - id: draft.v0.1
    path: drafts/BusinessCapabilityOntology_draft_v0.1.0
    role: historical-draft
    description: >-
      The reviewer's v0.1 Turtle package (`bc:` namespace): ontology,
      SHACL sketches, a synthetic example, a proposed ADR-002, audit and
      validation notes, and its own check script. Preserved byte-for-byte
      as imported, and checked against its own SHA256SUMS.txt. Never
      loaded as ontology: v0.4 section 9.1 renames every term, and its
      Turtle uses https://example.org/. Its `.ttl` files are not
      ontology-module, ontology-validation or test-fixture, which is
      what keeps them out of the digest, the ladder and the vendoring
      seeds.

  # ---- Documentation -------------------------------------------------

  - id: docs.readme
    path: README.md
    role: documentation
    description: The public front door.

  - id: docs.claude
    path: CLAUDE.md
    role: documentation
    description: >-
      Grounding for an agent working here: where the spec, the state and
      the method live, what to run before committing, and what not to
      touch.

  - id: docs.handoff
    path: docs/HANDOFF.md
    role: documentation
    description: >-
      What is actually in this repository, what is trustworthy, and what
      is not. Dated at the commit it describes: it is a snapshot, and a
      snapshot that pretends otherwise is worse than none.

  - id: docs.development
    path: docs/DEVELOPMENT.md
    role: documentation
    description: >-
      How to set up, run the checks, add a module or a shape set, and
      re-vendor the upstream. The conventions and the traps, separated
      from the reasoning behind them in PROCESS.md.

  - id: docs.process
    path: docs/process/PROCESS.md
    role: documentation
    description: >-
      How this repository is built, and why. Carried from ARO, which
      carried it from BFO-Aligned ValueNet, where the method was worked
      out.

  - id: docs.decisions
    path: docs/decisions
    role: documentation
    description: >-
      The decision record: the architect's acts and choices, recorded
      verbatim and dated, each citing the digest or commit of what it
      decided about. ADR-002, once ratified, is a separate document under
      docs/adr/ (spec section 2); its ratification act is recorded here.

  - id: docs.proposals
    path: docs/proposals
    role: documentation
    description: >-
      Proposals put to the architect for a decision: what is proposed,
      what was measured to support it, the options, and the decisions
      asked for. A proposal is not a decision; the architect's act on it
      is recorded in docs/decisions/, citing the proposal's commit.

  - id: docs.adr
    path: docs/adr
    role: documentation
    description: >-
      Architecture decision records: the BCO's design decisions, each
      PROPOSED until a ratification act in docs/decisions/ cites it by
      path, full commit and SHA-256. ADR-001 is BPO's; ADR-002 is reserved
      for specification v0.4; ADR-003 (controlled vocabulary) is the first
      written here.

  - id: docs.standards
    path: docs/standards
    role: documentation
    description: >-
      The ontology development standards the architect supplies, one per
      stage of the src/ layout, filed verbatim and never edited here.
      Stage 02 (Conceptual Modeling) is the first, supplied 2026-10-25
      (docs/decisions/2026-10-25-stage-02-choices.md).

  - id: docs.sources
    path: docs/sources
    role: documentation
    description: >-
      The citation register of authoritative sources on business
      capability (business-capability-definition-sources.md), with stable
      SRC-<family>-<nn> identifiers the specification can cite, and the
      five research notes behind it (notes/). Every entry carries its
      licence terms and a verification status (V, P, S, K, L); entries not
      read in the primary text are research input, not evidence. Holds
      citations and paraphrase only -- no copyrighted source text, which
      belongs in docs/Reference/ and is never tracked. Compiled
      2026-10-23 by AI research agents at the architect's direction.
      The register itself is three components declared below: the data,
      the companion prose, and the Markdown generated from both. The one
      exception to "citations and paraphrase only" is inventory/, the
      Capability Term Inventory, whose files are declared on their own
      below: it carries BPO's MIT-licensed text verbatim, as source
      evidence, under BPO's licence and attribution.

  - id: sources.register
    path: docs/sources/register.yaml
    role: documentation
    description: >-
      The source of truth for every register entry (ADR-003 D6,
      proposed): id, citation, URLs, licence and access terms, the
      paraphrased definition, the authority rating, at most one keyed
      quote, and claims whose status is exactly one of V, P, S, K, L.
      Content, not configuration: it is citations and paraphrase, read
      by tools/sources/build_register.py.

  - id: sources.register-companion
    path: docs/sources/register-companion.md
    role: documentation
    description: >-
      The register's analysis prose -- the summary, how to read it, the
      consensus, the fault lines and conflict matrix, the discrepancies,
      SF-01 to SF-13, the access gaps -- hand-authored, with one directive
      line marking where the generated entry tables go. Copied verbatim
      into the Markdown register.

  - id: generated.sources-register
    path: docs/sources/business-capability-definition-sources.md
    role: generated-artifact
    generator: tool.build-register
    description: >-
      The citation register as one Markdown document, with the stable
      SRC-<family>-<nn> identifiers the specification cites. Generated
      from register.yaml and register-companion.md; a test requires the
      committed bytes to equal a fresh generation, so an edit here fails
      the suite.

  # ---- Capability Term Inventory (scope approval 2026-10-27) ---------
  #
  # Source evidence (D6), not vocabulary and not an admission
  # (Amendment 4): what other projects say a capability is, one entry per
  # source item. Phase I-1 harvests the Business Process Ontology at a
  # pinned commit (config/inventory-sources.yaml).
  #
  # The entries are `source-evidence`, not `generated-artifact`, although
  # a tool writes them: they hold BPO's labels and definitions verbatim,
  # and BPO is a different project under its own MIT licence. A
  # generated-artifact is classified as this repository's content, which
  # would report BPO's text as ours and check no attribution. As
  # source-evidence they are dispositioned like the vendored files --
  # third-party, redistributed under the pinned licence, with
  # docs/sources/inventory/NOTICE.md as the attribution the licensing tool
  # checks -- and, unlike `vendored-ontology`, nothing that reads Turtle
  # (the validation ladder, the vendoring seeds, the site's term index)
  # selects the role. The findings hold only counts and BPO's IRIs, which
  # are facts about BPO measured here, so they are an ordinary generated
  # artifact.

  - id: inventory.bpo-entries
    path: docs/sources/inventory/bpo-entries.yaml
    role: source-evidence
    generator: tool.inventory-harvest-bpo
    redistributable: true
    description: >-
      Phase I-1: one entry per BPO source item at the pinned commit --
      every capability class (closure under CCO Organization Capability)
      with each module's declaration kept apart, and every
      capability_scope.json entry -- never merged. Labels and definitions
      tied to the APQC PCF are withheld until APQC's terms are verified
      (Phase I-2).

  - id: inventory.bpo-findings
    path: docs/sources/inventory/bpo-findings.yaml
    role: generated-artifact
    generator: tool.inventory-harvest-bpo
    description: >-
      Counts recalculated at the selected BPO commit and at the vendored
      baseline under BPO ADR-002's namespace mapping (capability classes,
      scope entries, enablesProcess triples, Q-12, Q-13), and the diff.
      IRIs and numbers only.

  - id: inventory.notice
    path: docs/sources/inventory/NOTICE.md
    role: documentation
    generator: tool.inventory-harvest-bpo
    description: >-
      Attribution for the BPO text the inventory redistributes, and the
      APQC evidence pinned for Phase I-2. Generated from
      config/inventory-sources.yaml; tools/licensing/disposition.py fails
      if the declared attribution is missing here.

  - id: inventory.readme
    path: docs/sources/inventory/README.md
    role: documentation
    description: >-
      What the inventory is and is not, its phases, the kinds of entry, the
      rights rule and how to regenerate and check it.

  - id: config.inventory-sources
    path: config/inventory-sources.yaml
    role: configuration
    description: >-
      The inventory's pins: BPO's selected commit and baseline, every input
      file with its sha256, the namespace mapping, BPO's licence and the
      APQC evidence, and where the outputs go.

  - id: tool.inventory-harvest-bpo
    path: tools/inventory/harvest_bpo.py
    role: tool
    description: >-
      Checks the inventory offline by default (schema, pinned digests, the
      rights rule, the admission guard, a fresh notice); with --rebuild,
      fetches the pinned files from raw.githubusercontent.com and rewrites
      the outputs; with --confirm, requires them to be byte-identical to a
      fresh harvest.

  # Phase I-2a, the rights review: hand-written judgement, checked by a
  # tool. It holds paraphrase, pins and quotes of at most 15 words from
  # the rights holders' notices -- no catalog content -- so it is this
  # repository's own text, `documentation`, not `source-evidence`. The
  # documents it pins are downloaded to .upstream-cache/i2a/ and never
  # committed.
  - id: inventory.rights
    path: docs/sources/inventory/rights.yaml
    role: documentation
    description: >-
      Phase I-2a: for APQC PCF 7.4 and 8.0, FEAF-II BRM 3.1 and FIBF, what
      the rights holder's terms permit, from primary evidence pinned by
      sha256; findings, open questions, decision points, and an empty
      architect_decision per source.

  - id: tool.inventory-rights
    path: tools/inventory/rights.py
    role: tool
    description: >-
      Checks the rights review offline by default (closed schema, every
      evidence item pinned, no catalog content or codes, quotes within 15
      words, gap reasons, the admission guard); with --confirm, refetches
      every pinned document from its official host and requires its
      digest.

  # Phase I-2b, the APQC PCF, under APQC-1 c: citation only in public
  # until APQC answers in writing (docs/decisions/2026-10-28-i2a-decided.md).
  # The tool reads the PCF 7.4 workbook BPO commits into internal evidence
  # that is never committed, and publishes only a status record of the
  # citation, the posture, aggregate counts and the internal outputs'
  # digests. The status record holds no PCF content, so it is this
  # repository's generated artifact, not `source-evidence`.
  - id: inventory.pcf-status
    path: docs/sources/inventory/pcf-status.yaml
    role: generated-artifact
    generator: tool.inventory-harvest-pcf
    description: >-
      Phase I-2b, public: the PCF 7.4 citation (rights holder, work,
      edition, BPO locator and workbook sha256), the APQC-1 c posture,
      counts per level and per entry kind, the sha256 of each internal
      output, and the state of E4 (deferred) and of PCF 8.0 (a gap until
      supplied). No PCF name, description, code or hierarchy.

  - id: tool.inventory-harvest-pcf
    path: tools/inventory/harvest_pcf.py
    role: tool
    description: >-
      Checks the PCF status record offline by default (closed schema,
      pins, consistent counts, a guard against any PCF name, description,
      element or hierarchy id, the admission guard; with the workbook
      cached, byte identity with a fresh build and the internal outputs'
      digests); with --write, reads the pinned workbook and writes the
      internal outputs and the status record, refusing any internal path
      git tracks or does not ignore; with --confirm, fetches the workbook
      from GitHub and requires byte identity; with --pcf80, the 7.4 to 8.0
      delta.

  - id: inventory.internal
    path: .inventory-internal
    role: third-party-reference
    redistributable: false
    tracked: false
    description: >-
      Phase I-2b's internal evidence: the PCF 7.4 entries (levels 1-3,
      with names, descriptions, hierarchy ids, locators and BPO bridge
      evidence), the empty E4 worksheet and, once the architect supplies
      PCF 8.0, the delta. APQC content whose public redistribution
      APQC-1 c withholds; it is gitignored, the tool refuses to write it
      anywhere git does not ignore, and `tracked: false` makes the
      repository-layout test require it absent from the index.

  - id: docs.trials
    path: docs/trials
    role: documentation
    description: >-
      Trial reports: what was measured, with which exact versions and
      commands, and the recommendation it supports. A report informs a
      decision; it is not one. 2026-10-p2-linkml.md is the P2 LinkML
      trial that ADR-003 D9 makes LinkML's adoption conditional on.

  - id: trial.p2-linkml
    path: trials/p2-linkml
    role: spike-artifact
    description: >-
      The P2 LinkML trial's inputs: a trial schema for ADR-003's concept
      record (not the vocabulary, and not normative), sample terms that
      must be accepted, one negative fixture per rule, value_presence
      probes, the fully pinned trial environment
      (requirements-linkml-trial.txt, never requirements-dev.txt), and
      run_trial.py, which measures determinism, blank nodes and
      validation. Nothing in the normal suite imports or loads any of it,
      and its YAML is not Turtle. The generated outputs are written
      outside the repository and recorded by digest in the report.

  - id: docs.import-inventory
    path: docs/ARTIFACT-INVENTORY.md
    role: documentation
    description: >-
      The record of the initial import (2026-10-22): which file came from
      where, and its SHA-256 at import. A test holds the files that are
      still as imported to those digests.

  - id: docs.import-manifest
    path: docs/artifact-manifest.json
    role: documentation
    description: The same import record, machine-readable.

  - id: licence.project
    path: LICENSE
    role: project-licence
    description: >-
      The terms this repository is offered under. Read by the licensing
      tool rather than assumed.

  # ---- Vendored upstream ontology ------------------------------------
  #
  # Redistributed, unlike docs/Reference, and the difference is the
  # licence rather than the convenience. BFO is CC BY 4.0, CCO is
  # BSD-3-Clause and BPO is MIT; all permit redistribution with
  # attribution, and vendor/NOTICE.md is that attribution.
  #
  # A separate role from `ontology-module` on purpose. These files are not
  # authored here and must not be counted as this repository's ontology:
  # the corpus digest would move when an upstream pin changed, and the
  # licensing tool would report third-party triples as project content.

  - id: vendor.bfo
    path: vendor/bfo/bfo-core-bco-extract.ttl
    role: vendored-ontology
    generator: tool.vendor-upstream
    redistributable: true
    description: >-
      The BFO terms this repository and its specification name, plus
      their named ancestry. Generated from a pinned commit; the file
      header records which one.

  - id: vendor.cco
    path: vendor/cco/cco-bco-extract.ttl
    role: vendored-ontology
    generator: tool.vendor-upstream
    redistributable: true
    description: >-
      The CCO v2.0 terms this repository, its specification and the
      vendored BPO act genera name, plus their named ancestry.

  - id: vendor.bpo
    path: vendor/bpo/bpo-ext-bco-extract.ttl
    role: vendored-ontology
    generator: tool.vendor-upstream
    redistributable: true
    description: >-
      The BPO act genera from apqc-ext.ttl that the specification names,
      plus their ancestry. The realizing act types a capability points
      down to (spec section 2) come from here. apqc-ext.ttl only: slices,
      catalog and capability modules are not vendored yet.

  - id: docs.vendor-notice
    path: vendor/NOTICE.md
    role: documentation
    generator: tool.vendor-upstream
    description: >-
      Attribution for the vendored extracts, as every upstream licence
      here requires. Generated, because an attribution file is exactly the
      kind of document that is right when written and quietly wrong after
      the next source is added.

  - id: config.upstream-sources
    path: config/upstream-sources.yaml
    role: configuration
    description: >-
      The pins: url, commit, digest, prefix and licence for each upstream.
      The url names the commit, so the bytes it serves cannot change.

  - id: generated.upstream-extracts
    path: config/upstream-extracts.json
    role: generated-artifact
    generator: tool.vendor-upstream
    description: >-
      What was taken from each upstream and what was left behind:
      dropped-axiom counts, and the terms the specification names that no
      pinned file describes.

  # ---- Vendored site assets ------------------------------------------
  #
  # Software the public site serves, not ontology: Mermaid, which renders
  # the conceptual models' diagrams in the reader's browser
  # (docs/decisions/2026-10-25-stage-02-choices.md, question 2). Vendored
  # because check_site refuses other-origin resources; pinned by the npm
  # integrity and each file's sha256 in config/site-vendor.yaml.
  #
  # `vendored-asset`, not `vendored-ontology`: these must never reach the
  # validation data graph, the term index or the vendoring tool's
  # extracts, and a shared role would put them one glob away from all
  # three. Redistributed under MIT, with vendor/site/NOTICE.md as the
  # attribution the licensing tool checks.

  - id: vendor.site-mermaid
    path: vendor/site/mermaid/mermaid.min.js
    role: vendored-asset
    generator: tool.site-vendor-assets
    redistributable: true
    description: >-
      Mermaid's single-file browser bundle, byte for byte as the pinned npm
      tarball holds it (package/dist/mermaid.min.js). Copied into the built
      site at assets/vendor/mermaid/ and loaded on the Models page only.

  - id: vendor.site-mermaid-licence
    path: vendor/site/mermaid/LICENSE
    role: vendored-asset
    generator: tool.site-vendor-assets
    redistributable: true
    description: >-
      Mermaid's MIT licence, from the same tarball (package/LICENSE),
      served on the site beside the bundle.

  - id: docs.site-vendor-notice
    path: vendor/site/NOTICE.md
    role: documentation
    generator: tool.site-vendor-assets
    description: >-
      Attribution for the vendored site assets, generated from
      config/site-vendor.yaml; tools/licensing/disposition.py fails if an
      attribution declared there is missing here.

  - id: config.site-vendor
    path: config/site-vendor.yaml
    role: configuration
    description: >-
      The site asset pins: version, tarball URL, npm integrity and shasum,
      the members taken with each one's sha256 and destination, and the
      licence.

  - id: tool.site-vendor-assets
    path: tools/site/vendor_assets.py
    role: tool
    description: >-
      Verifies the vendored site assets against their pins, offline, by
      default; with --fetch, downloads the pinned tarball, checks its
      integrity, extracts only the pinned members and writes them and the
      notice.

  # ---- Third-party reference material --------------------------------
  #
  # Consulted, cited, and never redistributed. Declared so the licensing
  # tool can see it and refuse to treat it as publishable, rather than
  # leaving that to whoever remembers.

  - id: reference.third-party
    path: docs/Reference
    role: third-party-reference
    redistributable: false
    tracked: false
    description: >-
      Licensed sources the work consults: capability frameworks (BIZBOK,
      TOGAF, BIAN -- spec section 1 names them as later catalog schemes)
      and the APQC Process Classification Framework. None is ours to
      publish. `tracked: false` is the load-bearing part: the files may
      live on disk because the work needs them, and a test requires them
      to be absent from the index. In ARO, four PDFs including a paid ISO
      standard were committed and served publicly while the README said
      they were not redistributed, and the history had to be rewritten.

  # ---- Controlled vocabulary (ADR-003; P3) ---------------------------
  #
  # Authored YAML in src/01_controlled_vocabulary/ (Stage 01; vocab/ until
  # 2026-10-25), built by tools/vocab/build.py into Turtle in
  # src/01_controlled_vocabulary/generated/. None of it is an
  # ontology-module, so none of it is in the corpus digest. Since P4 the generated Turtle is marked
  # `vocabulary: true`, which puts it in the validation ladder's data graph
  # (layout.vocabulary_files) under the wellformedness and vocabulary
  # shapes. P3 shipped the tool and no terms; P5 adds them.

  - id: vocab.metamodel
    path: src/01_controlled_vocabulary/metamodel.yaml
    role: documentation
    description: >-
      Metamodel concept records (bcom:), one per concrete row of
      specification section 4 (ADR-003 D4): provenance wrapper only --
      sources, drafting agent, notes, status inputs. Never a definition.
      An empty list in P3; P5 adds the terms, and from the first one the
      build requires every section 4 row to have a record.

  - id: vocab.catalog
    path: src/01_controlled_vocabulary/catalog.yaml
    role: documentation
    description: >-
      Catalog concept records (bcoc:): labels, a genus-differentia
      definition with its immediate genus and, apart, its foundational
      BFO/CCO ancestor (review R7, Finding E), broader, a typed PCF 7.4
      notation, sources. Empty in P3; 5 Draft concepts since P5.

  - id: vocab.agents
    path: src/01_controlled_vocabulary/agents.yaml
    role: documentation
    description: >-
      The declared agents (bcoa:, ADR-003 D8): the architect as a
      prov:Person, and claude-opus-5-5 as a prov:SoftwareAgent that acted
      on his behalf.

  - id: config.vocab-schema
    path: config/vocab-schema.yaml
    role: configuration
    description: >-
      The LinkML schema of the three authored vocabulary files, LinkML
      go-limited (docs/decisions/2026-10-24-p2-linkml-signoff.md):
      gen-json-schema is the only generator, linkml validate runs in CI.
      Derived from the P2 trial schema, corrected to ADR-003 as ratified.
      Describes shape only; every rule a schema cannot carry is in
      tools/vocab/build.py.

  - id: generated.vocab-json-schema
    path: config/vocab-schema.json
    role: generated-artifact
    generator: tool.vocab-schema-check
    description: >-
      gen-json-schema's output for config/vocab-schema.yaml, LF. The vocab
      CI job regenerates it and requires the bytes to match.

  - id: config.requirements-vocab
    path: requirements-vocab.txt
    role: configuration
    description: >-
      The full 91-package LinkML environment, pinned exactly, for the
      vocab CI job only. requirements-dev.txt and the main suite do not
      install or import LinkML.

  - id: generated.vocab-terms
    path: src/01_controlled_vocabulary/generated/bco-vocabulary.ttl
    role: generated-artifact
    generator: tool.vocab-build
    vocabulary: true
    description: >-
      The bco: annotation properties the vocabulary graph uses and the
      bco:PCFCode datatype (ADR-003 D1, D7). No class.

  - id: generated.vocab-metamodel
    path: src/01_controlled_vocabulary/generated/bco-metamodel.ttl
    role: generated-artifact
    generator: tool.vocab-build
    vocabulary: true
    description: >-
      bcom:MetamodelScheme and its concepts, definitions taken from
      specification section 4, with their current records and every prior
      record those revise (review R7, Finding B; commits read from git
      history). The scheme alone in P3.

  - id: generated.vocab-catalog
    path: src/01_controlled_vocabulary/generated/bco-catalog.ttl
    role: generated-artifact
    generator: tool.vocab-build
    vocabulary: true
    description: >-
      bcoc:CapabilityCatalogScheme and its concepts, with their current
      records and every prior record those revise (review R7, Finding B;
      commits read from git history). The scheme alone in P3.

  - id: generated.vocab-sources
    path: src/01_controlled_vocabulary/generated/bco-sources.ttl
    role: generated-artifact
    generator: tool.vocab-build
    vocabulary: true
    description: >-
      One bcos: record per register entry (ADR-003 D8): id and citation,
      and one bcos:<id>-claim-<n> resource per register claim with its
      index, status, scope and note (review R7, Finding A), generated from
      docs/sources/register.yaml.

  - id: generated.vocab-agents
    path: src/01_controlled_vocabulary/generated/bco-agents.ttl
    role: generated-artifact
    generator: tool.vocab-build
    vocabulary: true
    description: >-
      The declared bcoa: agents, generated from src/01_controlled_vocabulary/agents.yaml.

  - id: tool.vocab-build
    path: tools/vocab/build.py
    role: tool
    description: >-
      Builds the vocabulary Turtle from the authored YAML, deterministically,
      with ADR-003's checks: section 4 extraction (D4), derived status
      (D5), decision citations and ratification acts against git (D2, D3),
      sources and the quote tripwire (D6), typed notations (D7), declared
      agents (D8), content-minted IRIs and no blank nodes (D9).

  - id: tool.vocab-spec-terms
    path: tools/vocab/spec_terms.py
    role: tool
    description: >-
      Reads specification section 4's Terms tables and classifies every
      row as concrete, template (excluded with its reason) or a failure.

  - id: tool.vocab-citations
    path: tools/vocab/citations.py
    role: tool
    description: >-
      Checks a decision citation (path, full commit reachable from main,
      SHA-256 of the blob) and parses a ratification act's
      bco-ratification block.

  - id: tool.vocab-schema-check
    path: tools/vocab/schema_check.py
    role: tool
    description: >-
      Runs only where requirements-vocab.txt is installed: regenerates
      config/vocab-schema.json with gen-json-schema and compares it byte
      for byte (CRLF normalised to LF), and runs linkml validate over the
      authored files and over cases built to break the schema.

  # ---- Public site -----------------------------------------------------
  #
  # Built by tools/site/build_site.py into _site/ (gitignored) and deployed
  # by .github/workflows/pages.yml from the artifact the checks ran
  # against. Nothing generated is committed.

  - id: site.pages
    path: site/pages
    role: site-source
    description: >-
      One body fragment per page, with {{placeholders}} the builder fills
      from the repository. A placeholder nothing fills, and a fragment no
      navigation entry reaches, stop the build.

  - id: site.content
    path: site/content
    role: site-source
    description: >-
      The curated copy: site name, navigation, notices and the words a
      person has to choose. Holds no figure the build can derive.

  - id: site.assets
    path: site/src
    role: site-source
    description: >-
      Stylesheet and the explorer's two scripts, copied verbatim. Carried
      from BFO-Aligned ValueNet, where they were contrast-checked and
      reviewed in four browser engines; BCO additions are at the end of
      the stylesheet. Only .css and .js are allowed here.

  - id: tool.site-build
    path: tools/site/build_site.py
    role: tool
    description: >-
      Builds the site deterministically: term index, downloads with
      checksums, a byte-reproducible bundle, and the rendered
      specification and review.

  - id: tool.site-check
    path: tools/site/check_site.py
    role: tool
    description: >-
      Checks the built artifact: page structure, no external resources,
      every internal link and fragment resolving, downloads matching their
      checksums, the bundle matching its SHA256SUMS.

  # ---- Communications ------------------------------------------------

  - id: communications
    path: communications
    role: communication
    description: >-
      What this repository has said to, and heard from, other teams: one
      folder per team (BPO, ARO) with incoming/ and outgoing/. The
      protocol is communications/README.md; tools/communications.py checks
      every header, refuses an edited message, and derives which threads
      are open. Not published on the site.

  - id: tool.communications
    path: tools/communications.py
    role: tool
    description: >-
      Checks the communications record against its protocol and lists
      open threads. Status is derived from replies, never stored.

  # ---- Configuration and tooling --------------------------------------

  - id: config.layout
    path: config/repository-layout.yaml
    role: configuration
    description: This file.

  - id: config.licensing-adjudications
    path: config/licensing-adjudications.yaml
    role: configuration
    description: >-
      Owner rulings where a derived disposition is wrong for one named
      file. Empty, and policed: an adjudication naming no file fails.

  - id: tool.layout
    path: tools/layout.py
    role: tool
    description: Resolves component ids to paths. Reads this file.

  - id: tool.licensing
    path: tools/licensing/disposition.py
    role: tool
    description: >-
      Exactly one disposition per tracked file, derived from role and
      adjudication rather than from a list of filenames.

  - id: tool.vendor-upstream
    path: tools/ontology/vendor_upstream.py
    role: tool
    description: >-
      Fetches the pinned upstreams, extracts the referenced terms and
      their ancestry, and writes the extracts, the notice and the
      manifest. Verifies offline by default; rebuilding needs the network.

  - id: tool.validate
    path: tools/ontology/validate.py
    role: tool
    description: >-
      The SHACL ladder: every shape set against the authored ontology plus
      the vendored extracts, and against the fixtures built to break it.
      Gates against the baseline.

  - id: tool.corpus-digest
    path: tools/ontology/corpus_digest.py
    role: tool
    description: >-
      Ground digest and blank-node fingerprint of the authored ontology.

  - id: tool.build-register
    path: tools/sources/build_register.py
    role: tool
    description: >-
      Generates the Markdown citation register from register.yaml and its
      companion, deterministically, and refuses a claim status outside
      V/P/S/K/L, a quote over 15 words or with a bad key, an unknown SRC
      id anywhere in the tracked tree, a changed entry count, and a
      committed Markdown that differs from a fresh generation. Also
      answers which claims of an entry reach a given status.

  - id: generated.validation-baseline
    path: config/validation-baseline.json
    role: generated-artifact
    generator: tool.validate
    description: >-
      The findings this repository is known to carry, per shape set. Zero
      today, because nothing is authored yet; the gate keeps it from
      growing without a recorded reason.

  - id: generated.corpus-digest
    path: config/corpus-digest.json
    role: generated-artifact
    generator: tool.corpus-digest
    description: >-
      Ground digest and blank-node fingerprint of the authored ontology,
      committed because a test compares it against a fresh measure. An
      artifact nothing compares is a claim, not a measurement.
