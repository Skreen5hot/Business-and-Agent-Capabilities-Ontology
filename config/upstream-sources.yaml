# Pinned upstream ontologies, and what may be done with them.
#
# The BCO builds on three ontologies it does not author. BFO 2020 is the
# upper ontology; CCO supplies Organization, Agent Capability, Skill,
# Action Permission and the measurement ICEs; the Business Process
# Ontology (BPO) supplies the act types a capability is realized by
# (spec v0.4 section 1: "Act types come from the BPO reality layer and
# apqc-ext.ttl only"). A shape asking whether a realizing act type
# reaches obo:BFO_0000015 cannot answer without all three, so all three
# are vendored as pinned partial extracts.
#
# WHY EXTRACTS RATHER THAN owl:imports
#
# An owl:imports resolves over the network at validation time. That makes
# the result depend on when it ran and on what the far end served, which
# is the opposite of what a check is for. A pinned extract is part of the
# repository, identical on every machine, and reviewable.
#
# WHY PINNED TO A COMMIT RATHER THAN A TAG
#
# A tag can be moved to a different commit. The raw URLs below name the
# commit, so the bytes they serve cannot change; `sha256` records what
# those bytes were, so a proxy or a cache that serves something else is a
# refusal rather than a silent substitution.
#
# LICENSING
#
# All three may be redistributed on condition of attribution, which is
# what makes vendoring legitimate here. `licence_statement_contains` is
# checked against what the source itself says: for BFO and CCO, the
# file's own dcterms:license; for BPO, whose Turtle carries no licence
# statement, the LICENSE file at the same pinned commit (`statement_url`).
# Either way the SPDX identifier below is verified against an artifact at
# the pin rather than asserted by whoever wrote this file.
#
# `prefix` is what the extract is serialised with, and what the
# vendoring tool reads in the specification when it looks for the
# upstream terms the design names (spec text writes `cco:ont00001180`,
# not the full IRI).

