  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.810.648
  level: Service
  parent_code: B10.810
  name: Identification and Authentication
  description: Defines the set of capabilities to support the management of permissions
    for logging onto a computer, application, service, or network; includes user
    management and role/privilege management. This includes Identification and Authentication
    for digital signatures
  locator:
    page: 47
