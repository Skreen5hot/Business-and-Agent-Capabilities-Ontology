  code: '001'
  level: Service
  parent_code: null
  name: Homeownership Promotion
  description: Homeownership Promotion includes activities devoted to assisting citizens
    interested in buying homes and educating the public as to the benefits of homeownership.
  locator:
    page: 1
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-002-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '002'
  level: Service
  parent_code: null
  name: Community and Regional Development
  description: Community and Regional Development involves activities designed to
    assist communities in preventing and eliminating blight and deterioration, assist
    economically distressed communities, and encourage and foster economic development
    through improved public facilities and resources.
  locator:
    page: 1
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-004-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '004'
  level: Service
  parent_code: null
  name: Postal Services
  description: Postal Services provide for the timely and consistent exchange and
    delivery of mail and packages between businesses, organizations, and residents
    of the United States or between businesses, organizations, and residents of the
    United States and the rest of the world. It also includes the nationwide retail
    infrastructure required to make Postal Services easily accessible to customers.
  locator:
    page: 1
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-005-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '005'
  level: Service
  parent_code: null
  name: Criminal Incarceration
  description: Criminal Incarceration includes activities associated with the housing,
    custody and general care of criminals serving time in penitentiaries. This includes
    self‐improvement opportunities provided as part of Criminal Incarceration.
  locator:
    page: 1
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-006-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '006'
  level: Service
  parent_code: null
  name: Criminal Rehabilitation
  description: Criminal Rehabilitation includes all government activities devoted
    to providing convicted criminals with the educational resources and life skills
    necessary to rejoin society as responsible and contributing members. This includes
    work and treatment opportunities provided as part of Criminal Rehabilitation.
  locator:
    page: 1
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-008-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 008
  level: Service
  parent_code: null
  name: Disaster Preparedness and Planning
  description: Disaster Preparedness and Planning involves the development of response
    programs to be used in case of a disaster as well as pre‐disaster mitigation
    efforts to minimize the potential for loss of life and property. This involves
    the development of emergency management programs and activities as well as staffing
    and equipping regional response centers, and mitigation focused construction
    and preparation.
  locator:
    page: 1
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-009-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 009
  level: Service
  parent_code: null
  name: Disaster Repair and Restore
  description: Disaster Repair and Restore involves the immediate actions taken to
    respond to a disaster and the cleanup and restoration activities that take place
    after a disaster. These actions include, but are not limited to, providing mobile
    telecommunications, operational support, power generation, search and rescue,
    and medical life‐saving actions. It also involves the cleanup and rebuilding
    of homes, buildings, roads, environmental resources, or infrastructure that may
    be damaged due to a disaster.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-010-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '010'
  level: Service
  parent_code: null
  name: Emergency Response
  description: Emergency Response involves the immediate actions taken to respond
    to a disaster. These actions include, but are not limited to, providing mobile
    telecommunications, operational support, energy emergency preparedness, power
    generation, search and rescue, and medical life‐saving actions.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-011-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '011'
  level: Service
  parent_code: null
  name: Business and Industry Development
  description: Business and Industry Development supports activities related to the
    creation of economic and business opportunities and stimulus, and the promotion
    of financial and economic stability for corporations and citizens involved in
    different types of business.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-012-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '012'
  level: Service
  parent_code: null
  name: Intellectual Property Protection
  description: Intellectual Property Protection involves all activities to protect
    and promote the ownership of ideas and control over the tangible or virtual representation
    of those ideas, including inventions and discoveries; literary and artistic works;
    and symbols, names, images, and designs used in commerce.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-013-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '013'
  level: Service
  parent_code: null
  name: Financial Sector Oversight
  description: Financial Sector Oversight involves the regulation of private sector
    firms and markets (stock exchanges, corporations, etc.) to protect investors
    from fraud, monopolies, and illegal behavior. This also includes deposit protection.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-014-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '014'
  level: Service
  parent_code: null
  name: Industry Sector Income Stabilization
  description: Industry Sector Income Stabilization involves all programs and activities
    devoted to assisting adversely impacted industrial sectors (farming, commercial
    transportation, etc.) to ensure the continued availability of their services
    for the American public and the long‐term economic stability of these sectors.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-015-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '015'
  level: Service
  parent_code: null
  name: Elementary, Secondary, and Vocational Education
  description: Elementary, Secondary, and Vocational Education refers to the provision
    of education in elementary subjects (reading and writing and arithmetic); education
    provided by a high school or college preparatory school; and vocational and technical
    education and training.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-016-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '016'
  level: Service
  parent_code: null
  name: Higher Education
  description: Higher Education refers to education beyond the secondary level; specifically,
    education provided by a college or university.
  locator:
    page: 2
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-017-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '017'
  level: Service
  parent_code: null
  name: Cultural and Historic Preservation
  description: Cultural and Historic Preservation involves all activities performed
    by the federal government to collect and preserve information and artifacts important
    to the culture and history of the United States and its citizenry and the education
    of U.S. citizens and the world.
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-018-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 018
  level: Service
  parent_code: null
  name: Cultural and Historic Exhibition
  description: Cultural and Historic Exhibition includes all activities undertaken
    by the U.S. government to promote education through the exhibition of cultural,
    historical, and other information, archives, art, etc.
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-019-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 019
  level: Service
  parent_code: null
  name: Energy Production and Transmission
  description: Energy Production involves the transformation of raw energy resources
    into useable, deliverable energy. all activities devoted to ensuring the availability
    of an adequate supply of energy for the United States and its citizens. It involves
    the management and oversight of energy producing resources including facilities,
    dams, land, offshore resources and the private sector and includes all types
    of mass‐produced energy (e.g., hydroelectric, nuclear, wind, solar, or fossil
    fuels).
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-020-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '020'
  level: Service
  parent_code: null
  name: Energy Conservation
  description: Energy Conservation and Preparedness involves protection of energy
    resources from over consumption to ensure the continued availability of fuel
    resources and to promote environmental protection.
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-023-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '023'
  level: Service
  parent_code: null
  name: Environmental Monitoring and Forecasting
  description: Environmental Monitoring and Forecasting involves the observation
    and prediction of environmental conditions. This includes but is not limited
    to the monitoring and forecasting of water quality, water levels, ice sheets,
    air quality, regulated and non‐regulated emissions, as well as the observation
    and prediction of weather patterns and conditions.
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-024-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '024'
  level: Service
  parent_code: null
  name: Environmental Remediation
  description: Environmental Remediation supports the immediate and long‐term activities
    associated with the correcting and offsetting of environmental deficiencies or
    imbalances, including restoration activities.
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-025-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '025'
  level: Service
  parent_code: null
  name: Pollution Prevention and Control
  description: Pollution Prevention and Control includes activities associated with
    identifying appropriate pollution standards and controlling levels of harmful
    substances emitted into the soil, water and atmosphere from manmade sources.
    Environmental mitigation projects are also included in this business line.
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-026-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '026'
  level: Service
  parent_code: null
  name: Scientific and Technological Research and Innovation
  description: Scientific and Technological Research and Innovation includes all
    federal activities whose goal is the creation of new scientific and/or technological
    knowledge as a goal in itself, without a specific link to the other LoBs or Services
    of the BRM.
  locator:
    page: 3
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-027-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '027'
  level: Service
  parent_code: null
  name: Space Exploration and Innovation
  description: Space Exploration and Innovation includes all activities devoted to
    innovations directed at human and robotic space flight and the development and
    operation of space launch and transportation systems, and the general research
    and exploration of outer space
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-033-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '033'
  level: Service
  parent_code: null
  name: Border and Transportation Security
  description: Border and Transportation Security includes appropriately facilitating
    or deterring entry and exit of people, goods, and conveyances at and between
    U.S. ports of entry, as well as ensuring the security of transportation and infrastructure
    networks, facilities, vehicles, and personnel within the United States.
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-034-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '034'
  level: Service
  parent_code: null
  name: Key Asset and Critical Infrastructure Protection
  description: Key Asset and Critical Infrastructure Protection involves assessing
    key asset (e.g. bridge, power grid, dam, subways) and critical infrastructure
    vulnerabilities and taking direct action to mitigate vulnerabilities, enhance
    security, and ensure continuity and necessary redundancy in government operations
    and personnel.
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-036-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '036'
  level: Service
  parent_code: null
  name: Retirement and Disability Benefits
  description: Retirement and Disability Benefits involves the development of policies
    and management of retirement benefits, pension benefits, and income security
    for those who are retired or disabled (excluding Veteran Benefits).
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-037-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '037'
  level: Service
  parent_code: null
  name: Unemployment Compensation
  description: Unemployment Compensation provides income security to those who are
    no longer employed, while they seek new employment.
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-038-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 038
  level: Service
  parent_code: null
  name: Housing Assistance
  description: Housing Assistance involves the development and management programs
    that provide housing to those who are unable to provide housing for themselves
    including the rental of single‐family or multifamily properties, and the management
    and operation of federally supported housing properties.
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-039-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 039
  level: Service
  parent_code: null
  name: Food and Nutrition Assistance
  description: Food and Nutrition Assistance involves the development and management
    of programs that provide food and nutrition assistance to those members of the
    public who are unable to provide for these needs themselves.
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-040-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '040'
  level: Service
  parent_code: null
  name: Survivor Compensation
  description: Survivor Compensation provides compensation to the survivors of individuals
    currently receiving or eligible to receive benefits from the federal government.
    This includes, but is not limited to, survivors such as spouses or children of
    veterans or wage earners eligible for social security payments.
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-041-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '041'
  level: Service
  parent_code: null
  name: Foreign Affairs
  description: Foreign Affairs refers to those activities associated with the implementation
    of foreign policy and diplomatic relations, including the operation of embassies,
    consulates, and other posts; ongoing membership in international organizations;
    the development of cooperative frameworks to improve relations with other nations;
    and the development of treaties and agreements.
  locator:
    page: 4
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-043-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '043'
  level: Service
  parent_code: null
  name: Global Trade
  description: Global Trade refers to those activities the federal government undertakes
    to advance worldwide economic prosperity by increasing trade through the opening
    of overseas markets and freeing the flow of goods, services, and capital.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-044-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '044'
  level: Service
  parent_code: null
  name: Fugitive and Criminal Apprehension
  description: Criminal Apprehension involves activities associated with the tracking,
    arrest, detention, and transportation of groups or individuals responsible and
    believed to be responsible for committing federal crimes.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-045-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '045'
  level: Service
  parent_code: null
  name: Criminal Investigation and Surveillance
  description: Criminal Investigation and Surveillance includes collecting evidence
    required to determine responsibility for a crime and monitoring and questioning
    affected parties.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-047-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '047'
  level: Service
  parent_code: null
  name: Crime Prevention
  description: Crime Prevention entails all efforts designed to create safer communities
    through the control and reduction of crime by addressing the causes of crime
    and reducing opportunities for crimes to occur.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-048-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 048
  level: Service
  parent_code: null
  name: Leadership Protection
  description: Leadership Protection involves all activities performed to protect
    the health and well‐being of the president, vice‐president, their families, foreign
    leaders and dignitaries, federal judges, and other high‐level government officials.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-050-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '050'
  level: Service
  parent_code: null
  name: Substance Control
  description: Substance Control supports activities associated with the enforcement
    of laws regarding legal substances (i.e., alcohol and tobacco) and illegal narcotics
    including trafficking, possession, sale, distribution, and other related activities.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-051-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '051'
  level: Service
  parent_code: null
  name: Judicial Hearings
  description: Judicial Hearings includes activities associated with proceedings
    (usually by a court of law) where evidence is taken for the purpose of determining
    an issue of fact and reaching a decision based on that evidence.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-052-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '052'
  level: Service
  parent_code: null
  name: Legal Defense
  description: Legal Defense includes those activities associated with the representation
    of a defendant in a criminal or civil proceeding.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-053-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '053'
  level: Service
  parent_code: null
  name: Legal Investigation
  description: Legal Investigation includes activities associated with gathering
    information about a given party (government agency, citizen or corporation) that
    would be admissible in a court of law in an attempt to determine a legal question
    or matter.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-054-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '054'
  level: Service
  parent_code: null
  name: Legal Prosecution and Litigation
  description: Legal Prosecution and Litigation includes all activities involved
    with presenting a case in a legal proceeding both in a criminal or civil court
    of law in an attempt to prove guilt/responsibility.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-055-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '055'
  level: Service
  parent_code: null
  name: Resolution Facilitation
  description: Resolution Facilitation refers to those activities outside a court
    of law, such as mediation and arbitration, which may be used in an attempt to
    settle a dispute between two or more parties (government agency, citizen, or
    corporation).
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-056-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '056'
  level: Service
  parent_code: null
  name: Water Resource Management
  description: Water Resource Management includes all activities that promote the
    effective use, protection and management of the nation’s water resources.
  locator:
    page: 5
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-057-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '057'
  level: Service
  parent_code: null
  name: Conservation, Marine and Land Management
  description: Conservation, Marine and Land Management involves the responsibilities
    of surveying, maintaining, and operating public lands and monuments, as well
    as activities devoted to ensuring the preservation of land, water, wildlife,
    and natural resources, both domestically and internationally. It also includes
    the sustainable stewardship of natural resources on federally owned/controlled
    lands for commercial use (mineral mining, grazing, forestry, fishing, etc.).
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-058-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 058
  level: Service
  parent_code: null
  name: Recreational Resource Management and Tourism
  description: Recreational Resource Management and Tourism involves the management
    of national parks, monuments, and tourist attractions as well as visitor centers,
    campsites, and park service facilities.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-060-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '060'
  level: Service
  parent_code: null
  name: Air Transportation
  description: Air Transportation involves the activities related to the safe passage
    of passengers or goods through the air. It also includes command and control
    activities related to the safe movement of aircraft through all phases of flight
    for commercial and military operations.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-061-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '061'
  level: Service
  parent_code: null
  name: Ground Transportation
  description: Ground Transportation involves the activities related to ensuring
    the availability of transit and the safe passage of passengers and goods over
    land.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-062-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '062'
  level: Service
  parent_code: null
  name: Water Transportation
  description: Water Transportation involves the activities related to ensuring the
    availability of transit and the safe passage of passengers and goods over sea
    and water.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-063-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '063'
  level: Service
  parent_code: null
  name: Space Transportation
  description: Space Transportation involves the activities related to ensuring the
    availability of transit and the safe passage of passengers and goods through
    aerospace.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-064-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '064'
  level: Service
  parent_code: null
  name: Training and Employment
  description: Training and Employment includes programs of job or skill training,
    employment services and placement, and programs for non‐federal employees to
    promote the hiring of marginal, unemployed, or low‐income workers.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-065-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '065'
  level: Service
  parent_code: null
  name: Labor Rights Management
  description: Labor Rights Management refers to those activities undertaken to ensure
    that employees and employers are aware of and comply with all statutes and regulations
    concerning labor rights, including those pertaining to wages, benefits, safety
    and health, whistleblower, and non‐discrimination policies for non‐federal employees.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-066-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '066'
  level: Service
  parent_code: null
  name: Worker Safety
  description: Worker Safety refers to those activities undertaken to save lives,
    prevent injuries, and protect the health of America's workers.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-070-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '070'
  level: Service
  parent_code: null
  name: General Purpose Data and Statistics
  description: General Purpose Data and Statistics includes activities performed
    in providing empirical, numerical, and related data and information pertaining
    to the current state of the nation in areas such as the economy, labor, weather,
    international trade, etc.
  locator:
    page: 6
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-077-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '077'
  level: Service
  parent_code: null
  name: Inspection and Auditing
  description: Inspections and Auditing involves the methodical examination and review
    of regulated activities to ensure compliance with standards for regulated activity.
    This can include (but does not have to include) Firearms, Explosives, and Controlled
    Substances inspections and auditing.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-079-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: 079
  level: Service
  parent_code: null
  name: Permits and Licensing
  description: Permits and Licensing involves activities associated with granting,
    revoking, and the overall management of the documented authority necessary to
    perform a regulated task or function.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-101-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '101'
  level: Service
  parent_code: null
  name: Budget Formulation
  description: Budget Formulation involves resource planning activities that align
    Federal resources allocated through budget formulation and submission. It involves
    all activities undertaken to determine priorities for future spending and to
    develop an itemized forecast of future funding and expenditures during a targeted
    period of time. This includes the collection and use of performance information
    to assess the effectiveness of programs and develop budget priorities.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-103-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '103'
  level: Service
  parent_code: null
  name: Enterprise Architecture
  description: Enterprise Architecture is an established process for describing the
    current state and defining the target state and transition strategy for an organization’s
    people, processes, and technology.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-104-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '104'
  level: Service
  parent_code: null
  name: Strategic Planning
  description: Strategic Planning entails the determination of annual and long‐term
    goals and the identification of the best approach for achieving those goals.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-105-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '105'
  level: Service
  parent_code: null
  name: Budget Execution
  description: Budget Execution involves the legal (apportionment) and managerial
    (allotment and sub‐allotment) distribution of budget authority to achieve results
    consistent with the formulated budget.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-106-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '106'
  level: Service
  parent_code: null
  name: Workforce Planning
  description: Workforce Planning involves the processes for identifying the workforce
    competencies required to meet the agency’s strategic goals and for developing
    the strategies to meet these requirements.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-108-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '108'
  level: Service
  parent_code: null
  name: Customer Services
  description: Supports activities associated with providing an agency’s customers
    with information regarding the agency’s service offerings and managing the interactions
    and relationships with those customers, and/or national interest including official
    information dissemination, service/product outreach, and public relations.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-113-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '113'
  level: Service
  parent_code: null
  name: Public Comment Tracking
  description: Public Comment Tracking involves the activities of soliciting, maintaining,
    and responding to public comments regarding proposed regulations.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-115-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '115'
  level: Service
  parent_code: null
  name: Rule Publication
  description: Rule Publication includes all activities associated with the publication
    of a proposed or final rule in the Federal Register and Code of Federal Regulations.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-116-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '116'
  level: Service
  parent_code: null
  name: Debt Collection
  description: Debt Collection supports activities associated with the collection
    of money owed to the U.S. government from both foreign and domestic sources.
  locator:
    page: 7
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-118-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '118'
  level: Service
  parent_code: null
  name: Federal Asset Sales
  description: Federal Asset Sales encompasses the activities associated with the
    acquisition, oversight, tracking, and sale of non‐internal assets managed by
    the federal government with a commercial value and sold to the private sector.
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-119-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '119'
  level: Service
  parent_code: null
  name: Facilities, Fleet and Equipment Management
  description: Facilities, Fleet, and Equipment Management involves the maintenance,
    administration, certification, and operation of office buildings, fleets, machinery,
    and other capital assets that are the responsibility of the federal government.
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-120-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '120'
  level: Service
  parent_code: null
  name: Help Desk Services
  description: Help Desk Services involves the management of a service center to
    respond to government and contract employees' technical and administrative questions.
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-121-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '121'
  level: Service
  parent_code: null
  name: Security Management
  description: 'Security Management involves the physical protection of an organization’s
    personnel, assets, and facilities (including security clearance management).
    Note: Activities related to securing data and information systems are addressed
    under additional Services in the "810‐Cyber security management" Function.'
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-122-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '122'
  level: Service
  parent_code: null
  name: Travel
  description: Travel involves the activities associated with planning, preparing,
    and monitoring of business related travel for an organization’s employees.
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-124-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '124'
  level: Service
  parent_code: null
  name: Accounting
  description: Accounting entails accounting for assets, liabilities, fund balances,
    revenues and expenses associated with the maintenance of federal funds and expenditure
    of federal appropriations (Salaries and Expenses, Operation and Maintenance,
    Procurement, Working Capital, Trust Funds, etc.), in accordance with applicable
    federal standards (FASAB, Treasury, OMB, GAO, etc.).
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-126-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
