  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.805.255
  level: Service
  parent_code: B10.805
  name: Employee Performance Management
  description: Employee Performance Management designs, develops, and implements
    a comprehensive performance management approach to ensure agency employees are
    demonstrating competencies required of their work assignments. Design, develop
    and implement a comprehensive performance management strategy that enables managers
    to make distinctions in performance and links individual performance to agency
    goal and mission accomplishment. This Service also includes managing employee
    performance at the individual level and evaluating the overall effectiveness
    of the agency’s employee development approach.
  locator:
    page: 42
  mission_sector_as_stated: General Government
  business_function_as_stated: Central personnel management
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.805.256-brm-service
