- id: INV-FEAF-BRM-TAX-B01.050-brm-business-function
  kind: brm-business-function
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B01.050
  level: Business Function
  parent_code: B01
  name: National Defense
  description: Common defense and security of the United States. It encompasses the
    raising, equipping, and maintaining of armed forces (including civilian support
    activities), development and utilization of weapons systems (including nuclear
    weapons), and related programs; direct compensation and benefits paid to active
    military and civilian personnel and contributions to their retirement, health,
    and life insurance funds; defense research, development, testing, and evaluation;
    and procurement, construction, stockpiling, and other activities undertaken to
    directly foster national security.
  locator:
    page: 3
  mission_sector_as_stated: Defense and National Security
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B01.050.279-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B01.050.279
  level: Service
  parent_code: B01.050
  name: Battlespace Networks
  description: Battlespace Networks includes activities that extend “commercial like”
    IT Infrastructure to meet the connectivity and interoperability needs of deployed
    and mobile warfighting capabilities. This function focuses on information transport;
    and computing and enterprise services capabilities for the tactical edge users.
    It includes tactical edge networks and gateways to enable end‐to‐end connectivity
    between battlespace networks and IT infrastructure capabilities.
  locator:
    page: 3
  mission_sector_as_stated: Defense and National Security
  business_function_as_stated: National Defense
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B01.050.280-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B01.050.280
  level: Service
  parent_code: B01.050
  name: Command and Control
  description: Command and Control includes activities that facilitate the exercise
    of authority and direction by a properly designated commander or decision maker
    over assigned and attached forces and resources in the accomplishment of the
    mission. It includes activities to align or synchronize interdependent and disparate
    entities to achieve unity of effort, understand information about the environment
    and situation to aid in decision making, establish a framework and select a course
    of action to employ resources to achieve a desired outcome/effect; and observe
    and assess events/effects of a decision.
  locator:
    page: 3
  mission_sector_as_stated: Defense and National Security
  business_function_as_stated: National Defense
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B01.050.281-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B01.050.281
  level: Service
  parent_code: B01.050
  name: Force Application
  description: Force Application includes activities to integrate the use of maneuver
    and engagement in all environments, to create the effects necessary for achieving
    DoD mission objectives. Maneuver is the ability to move to a position of advantage
    in all environments in order to generate or enable the generation of effects
    in all domain and the information environment. Engagement is the ability to use
    kinetic and non‐kinetic means in all environments to generate the desired lethal
    and/or non‐lethal effects from all domains and the information environment.
  locator:
    page: 4
  mission_sector_as_stated: Defense and National Security
  business_function_as_stated: National Defense
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B01.050.282-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B01.050.282
  level: Service
  parent_code: B01.050
  name: Protection
  description: Protection involves Citizen Protection, Leadership Protection and
    Property Protection; it involves all activities performed to protect the general
    population of the United States, president, vice‐president, their families, foreign
    leaders and dignitaries, and other high‐level government officials from criminal
    activity and entails all activities performed to ensure the security of civilian
    and government property as well as foreign diplomatic missions.
  locator:
    page: 4
  mission_sector_as_stated: Defense and National Security
  business_function_as_stated: National Defense
  rights_status: us-government-work
