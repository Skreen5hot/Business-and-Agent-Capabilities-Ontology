  parent_code: null
  name: Payments
  description: Payments includes disbursements of federal funds, via a variety of
    mechanisms, to federal and private individuals, federal agencies, state, local
    and international governments, and the private sector, to effect payment for
    goods and services, or distribute entitlements, benefits, grants, subsidies,
    loans, or claims.
  locator:
    page: 8
  rights_status: us-government-work
