- id: INV-FEAF-BRM-TAX-B10.806-brm-business-function
  kind: brm-business-function
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.806
  level: Business Function
  parent_code: B10
  name: General purpose fiscal assistance
  description: Federal aid to state, local, and territorial governments that is available
    for general fiscal support. The transactions of the now discontinued general
    revenue‐sharing program are included in the historical data for this subfunction.
    Also includes grants for more restricted purposes when the stipulated purposes
    cross two or more major budgetary functions and the distribution among those
    functions is at the discretion of the recipient jurisdiction rather than the
    federal government. Includes payments in lieu of taxes, broad‐purpose shared
    revenues, and the federal payment to the District of Columbia. Excludes payments
    specifically for community development or social services programs.
  locator:
    page: 43
  mission_sector_as_stated: General Government
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.806.320-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.806.320
  level: Service
  parent_code: B10.806
  name: Credit and Insurance
  description: Credit and Insurance includes providing protection to individuals
    or entities against specified risks (The specified protection generally involves
    risks that private sector entities are unable or unwilling to assume or subsidize
    and where the provision of insurance is necessary to achieve social objectives),
    Loan Guarantees and Direct Loans.
  locator:
    page: 43
  mission_sector_as_stated: General Government
  business_function_as_stated: General purpose fiscal assistance
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.806.362-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.806.362
  level: Service
  parent_code: B10.806
  name: Federal Financial Assistance
  description: Federal Financial Assistance refers to the transfer of money, property,
    services, or anything of value, the principal purpose of which is to accomplish
    a public purpose of support or stimulation authorized by Federal statute. Assistance
    includes, but is not limited to grants, loans, loan guarantees, scholarships,
    mortgage loans, insurance, and other types of financial assistance, including
    cooperative agreements; property, technical assistance, counseling, statistical,
    and other expert information; and service activities of regulatory agencies.
  locator:
    page: 43
  mission_sector_as_stated: General Government
  business_function_as_stated: General purpose fiscal assistance
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.806.363-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.806.363
  level: Service
  parent_code: B10.806
  name: Federal Funds to States and Local Governments
  description: Federal Funds to States and Local Governments includes Formula Grants,
    Project/Competitive Grants (Project/Competitive grants can include fellowships,
    scholarships, research grants, training grants, traineeships, experimental and
    demonstration grants, evaluation grants, planning grants, technical assistance
    grants, survey grants, and construction grants), State Loans, and other direct
    payment to State or Local jurisdictions by the Federal Government.
  locator:
    page: 44
  mission_sector_as_stated: General Government
  business_function_as_stated: General purpose fiscal assistance
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.808-brm-business-function
  kind: brm-business-function
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
