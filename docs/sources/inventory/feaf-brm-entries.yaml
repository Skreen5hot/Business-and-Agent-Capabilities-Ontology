  code: '308'
  level: Service
  parent_code: null
  name: Environmental Waste Management
  description: Environmental Waste Management includes activities associated with
    identifying appropriate pollution standards and controlling levels of harmful
    substances emitted into the soil, water and atmosphere from manmade sources.
    Environmental mitigation projects are also included.
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-309-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '309'
  level: Service
  parent_code: null
  name: Environmental Site Stewardship
  description: Environmental Site Stewardship supports the immediate and long‐term
    activities associated with the correcting and offsetting of environmental deficiencies
    or imbalances, including restoration activities at facilities under the stewardship
    of the Federal Government.
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-310-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '310'
  level: Service
  parent_code: null
  name: Food and Drug Quality and Safety
  description: Food and Drug Quality and Safety assesses quality indicators and safety
    metrics as a means to protect and promote the health of the general population.
    This includes monitoring of humans, animals, animal products, and plants, as
    well as tracking the spread of diseases and pests. Also includes evaluation of
    food and drug related incidents to assess the potential risks and dangers; education
    of the consumer and the general population; and facilitation of health promotion
    and disease and injury prevention.
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-311-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '311'
  level: Service
  parent_code: null
  name: Vocational Rehabilitation
  description: Vocational Rehabilitation includes all activities devoted to providing
    educational resources and life skills necessary to rejoin society as responsible
    and contributing members.
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-312-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '312'
  level: Service
  parent_code: null
  name: Navigation
  description: Navigation includes all means for the representation of position information
    through the use of attributes such as elevation, latitude, and longitude coordinates.
    This includes land‐based and space‐based geo‐positioning technologies and services.
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-313-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '313'
  level: Service
  parent_code: null
  name: Population Health Management
  description: Population Health Management assesses health indicators as a means
    to protect and promote the health of the general population. This includes monitoring
    of health, health planning, and health management of humans, animals, animal
    products, and plants, as well as tracking the spread of diseases and pests. Also
    includes evaluation of consumer products, drug, and foods to assess the potential
    risks and dangers; education of the consumer and the general population; and
    facilitation of health promotion and disease and injury prevention.
  locator:
    page: 14
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-314-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '314'
  level: Service
  parent_code: null
  name: Assistive Technology Services
  description: Assistive Technology Services is composed of hardware and software
    that help people who are physically or visually impaired, as well as ensuring
    electronic and information technology is accessible to people with disabilities,
    including employees and members of the public (i.e. 508 Compliant). This includes
    developing standards for all electronic and information technology.
  locator:
    page: 14
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-315-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '315'
  level: Service
  parent_code: null
  name: Threat and Vulnerability Management
  description: Threat and Vulnerability Management involves all functions pertaining
    to the protection of federal information and information systems from unauthorized
    access, use, disclosure, disruptions, modification, or destruction, as well as
    the creation and implementation of security policies, procedures and controls.
    It includes all risk and controls tracking for IT systems.
  locator:
    page: 14
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-316-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '316'
  level: Service
  parent_code: null
  name: Continuous Monitoring
  description: Continuous Monitoring includes all activities related to the real‐time
    monitoring of security controls employed within or inherited by a system. (see
    Appendix G of NIST Special Publication 800‐37)
  locator:
    page: 14
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-317-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '317'
  level: Service
  parent_code: null
  name: Data Integrity and Privacy Management
  description: Data Integrity and Privacy Management involves the coordination of
    data collection, storage, dissemination, and destruction as well as managing
    the policies, guidelines, and standards regarding data management, so that data
    quality is maintained and information is shared or available in accordance with
    the law and best practices
  locator:
    page: 14
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-318-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '318'
  level: Service
  parent_code: null
  name: Business Analytics
  description: Business analytics includes all forms of data analysis of extremely
    large, complex data sets (big data) that are manipulated for business (mission)
    consumption.
  locator:
    page: 14
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-319-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '319'
  level: Service
  parent_code: null
  name: Regulatory Compliance
  description: Activities associated with the direct monitoring and oversight of
    a specific industry or mission sector participating in a regulated activity including
    sector specific standard setting/reporting guideline development. Includes activities
    associated with developing sector specific regulations, policies, and guidance
    to implement laws to include public comment and tracking, regulatory creation,
    and rule publication.
  locator:
    page: 14
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-320-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '320'
  level: Service
  parent_code: null
  name: Credit and Insurance
  description: Credit and Insurance includes providing protection to individuals
    or entities against specified risks (The specified protection generally involves
    risks that private sector entities are unable or unwilling to assume or subsidize
    and where the provision of insurance is necessary to achieve social objectives),
    Loan Guarantees and Direct Loans.
  locator:
    page: 15
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-321-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '321'
  level: Service
  parent_code: null
  name: Regulatory Enforcement
  description: Activities associated with the direct enforcement of a specific industry
    or mission sector participating in a regulated activity using inspections and
    auditing. Includes activities associated with developing sector specific regulations,
    policies, and guidance to implement laws to include public comment and tracking,
    regulatory creation, and rule publication.
  locator:
    page: 15
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-322-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '322'
  level: Service
  parent_code: null
  name: Public Communications Infrastructure
  description: Public Communications Infrastructure includes the management and stewardship
    of a type of information by the federal government and/or the creation of physical
    communication infrastructures on behalf of the public in order to facilitate
    communication. This includes management of the nation's spectrum assets.
  locator:
    page: 15
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-324-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '324'
  level: Service
  parent_code: null
  name: Adjudicate Non‐Judicial Requests
  description: Determining the applicability of relevant statute, regulation, standard
    or policy to a specific individual or organizations actions or requests. Also,
    adjudicate Non‐Judicial Requests includes those activities outside a court of
    law, such as mediation and arbitration, which may be used in an attempt to settle
    a dispute between two or more parties (government agency, citizen, or corporation).
  locator:
    page: 15
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-325-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '325'
  level: Service
  parent_code: null
  name: Information Discovery
  description: Information Discovery consists of all activities used to obtain information
    that is not readily obtainable. This includes information that is gathered to
    gain situational awareness. For example, national air surveillance resources
    that collect, analyze, and disseminate surveillance information about the national
    airspace.
  locator:
    page: 15
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-326-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '326'
  level: Service
  parent_code: null
  name: IT System Development / Integration Support
  description: IT System Development / Integration Support includes the software
    services enabling elements of distributed business applications to interoperate
    and the software development necessary to facilitate such integration. These
    elements can share function, content, and communications across heterogeneous
    computing environments.
  locator:
    page: 15
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-327-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '327'
  level: Service
  parent_code: null
  name: Enterprise Licenses and Software
  description: Enterprise Licenses and Software includes License Management and Software
    Distribution; it supports the purchase, upgrade and tracking of legal usage contracts
    for system software and applications and supports the propagation, installation
    and upgrade of written computer programs, applications and components.
  locator:
    page: 15
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-328-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '328'
  level: Service
  parent_code: null
  name: Collect Revenues and User Fees
  description: Collect Revenues and User Fees supports activities associated with
    the collection of money owed to the U.S. government from both foreign and domestic
    sources. It also involves the collection of fees assessed on individuals or organizations
    for the provision of Government services and for the use of Government goods
    or resources.
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-329-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '329'
  level: Service
  parent_code: null
  name: Continuity of Operations
  description: Continuity of Operations involves the activities associated with the
    identification of critical systems and processes, and the planning and preparation
    required to ensure that these systems and processes will be available in the
    event of a catastrophic event and involves the internal actions necessary to
    develop a plan for resuming operations after a catastrophic event occurs. This
    can include Contingency Planning, Continuity of Operations and Service Recovery
    work.
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-330-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '330'
  level: Service
  parent_code: null
  name: Legislative Relations
  description: Legislative Relations involves activities aimed at the development,
    tracking, and amendment of public laws through the legislative branch of the
    federal government. It includes tracking, testimony, proposal development and
    congressional liaison operations.
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-331-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '331'
  level: Service
  parent_code: null
  name: International Security Assistance
  description: International Security Assistance involves activities taken abroad
    to protect and advance U.S. interests and, if deterrence fails, decisively defeat
    threats to those interests.
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-332-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '332'
  level: Service
  parent_code: null
  name: Hospital and medical care for veterans
  description: Hospital and medical care for veterans assures that federal health
    care resources for Veterans are expended effectively to ensure quality, safety,
    and efficiency and provides and supports the delivery of health care to Veterans.
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-333-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '333'
  level: Service
  parent_code: null
  name: Veteran Benefits and Services
  description: The Veteran Benefits and Services service involves the development
    and management of retirement benefits, pension benefits, and income security
    for Veterans.
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-336-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '336'
  level: Service
  parent_code: null
  name: Seized Asset Management
  description: Seized Asset Management involves the seizure, storage, administrative
    tracking and management of property seized from individuals responsible or believed
    to be responsible for committing federal crimes.
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-337-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '337'
  level: Service
  parent_code: null
  name: Credential Issuance and Management
  description: 'Credential Issuance and Management: the researching, tracking and
    providing of user access credentials (logical and physicals) and associated security
    features for the protection of federal information and information systems from
    unauthorized access, use, disclosure, disruptions, modification, or destruction,
    as well as the creation and implementation of related security policies, procedures
    and controls. This includes background checks and related personnel security
    management services.'
  locator:
    page: 16
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-338-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '338'
  level: Service
  parent_code: null
  name: Enterprise Search
  description: Enterprise Search includes Query capabilities, Precision / Recall
    Ranking, Classification and Pattern Matching.
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-339-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '339'
  level: Service
  parent_code: null
  name: Information Mapping / Taxonomy / Categorization
  description: Information Mapping/ Taxonomy/ Categorization defines the set of capabilities
    to support the creation and maintenance of relationships between data entities,
    naming standards and categorization and allow classification of data and information
    into specific layers or types to support an organization.
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-340-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '340'
  level: Service
  parent_code: null
  name: Collaboration Tools
  description: The Tools or systems that allow multiple parties to interact and share
    documents or data through a shared work space or environment. Multiple parties
    contribute or update the shared environment and view, update, edit, & share files.
    This includes systems such as SharePoint, MAX, Web Conferencing, Cisco TelePresence,
    etc.)
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-341-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '341'
  level: Service
  parent_code: null
  name: Web Infrastructure
  description: 'Web Infrastructure includes equipment/services to support delivery
    of services over the Internet or similar networks. These include supporting:
    Network Services which consists of protocols defining the format and structure
    of data and information either accessed from a directory or exchanged through
    communications; Service Transport which consists of protocols defining the format
    and structure of data and information either accessed from a directory or exchanged
    through communications.'
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-343-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '343'
  level: Service
  parent_code: null
  name: Audio / Video Conferencing
  description: Audio / Video Conferencing entails communication across long distances
    with audio and / or video contact that may also include graphics and data exchange
    and includes all equipment, software, hardware, networks, etc. necessary to perform
    these functions.
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-344-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '344'
  level: Service
  parent_code: null
  name: Content Management
  description: Content Management includes Content Authoring, Content Review and
    Approval, Tagging and Aggregation, Content Publishing and Delivery and Syndication
    Management.
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-345-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '345'
  level: Service
  parent_code: null
  name: Management of Government Records
  description: Management of Government Records involves the management and stewardship
    of a type of information by the federal government in order to facilitate communication
    and information archival. This classification and taxonomic processes that links
    logical data and information sets.
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-346-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '346'
  level: Service
  parent_code: null
  name: Criminal and Terrorist Threat Mitigation
  description: Criminal and Terrorist Threat Mitigation involves counter activities
    to prevent, disrupt, weaken, eliminate, and bring to justice threats from organized
    crime groups, terror networks, gangs, and drug‐cartels.
  locator:
    page: 17
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-347-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
