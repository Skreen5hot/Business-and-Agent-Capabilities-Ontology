  level: Service
  parent_code: B01.050
  name: Force Training
  description: Force Training includes activities to develop, enhance, adapt and
    sustain the capacity to perform specific functions and tasks, during and in preparation
    for wartime and conflicts, in order to improve the individual or collective performance
    of personnel, units, forces, and staffs. These activities include, but are not
    limited to, unit force training; and training in operating weapon systems. This
    does not include general professional development or training.
  locator:
    page: 4
  mission_sector_as_stated: Defense and National Security
  business_function_as_stated: National Defense
  rights_status: us-government-work
