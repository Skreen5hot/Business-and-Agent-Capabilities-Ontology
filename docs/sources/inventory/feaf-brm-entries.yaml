  code: '139'
  level: Service
  parent_code: null
  name: Provide and Maintain IT Infrastructure
  description: IT Infrastructure Maintenance involves the planning, design, and maintenance
    of an IT Infrastructure to effectively support automated needs (i.e. platforms,
    networks, servers, printers, etc.).
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-143-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '143'
  level: Service
  parent_code: null
  name: Goods and Services Acquisition
  description: Goods and Services Acquisition involves the procurement of physical
    goods, products, and capital assets to be used by the federal government and
    the oversight and/or management of contractors and service providers from the
    private sector.
  locator:
    page: 8
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-144-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '144'
  level: Service
  parent_code: null
  name: Inventory Control
  description: Inventory Control refers to the tracking of information related to
    procured assets and resources with regard to quantity, quality, and location.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-145-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '145'
  level: Service
  parent_code: null
  name: Logistics Management
  description: Logistics Management involves the planning and tracking of personnel
    and their resources in relation to their availability and location.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-176-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '176'
  level: Service
  parent_code: null
  name: Legislative Functions
  description: Legislative Functions is defined by the Executive branch processes
    associated with working with the Legislative Branch (i.e. Congress) except for
    the Tax Court, the Library of Congress, and the Government Printing Office revolving
    fund.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-180-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '180'
  level: Service
  parent_code: null
  name: Taxation Management
  description: Taxation Management includes activities associated with the implementation
    of the Internal Revenue Code and the collection of taxes in the United States
    and abroad.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-217-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '217'
  level: Service
  parent_code: null
  name: Access to Care
  description: Access to Care focuses on the access to appropriate care. This includes
    streamlining efforts to receive care; ensuring care is appropriate in terms of
    type, care, intensity, location and availability; providing seamless access to
    health knowledge, enrolling providers; performing eligibility determination,
    and managing patient movement. It can include aid to family with children, immunization
    programs, and child support enforcement.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-228-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '228'
  level: Service
  parent_code: null
  name: Labor Relations
  description: Labor Relations manages the relationship between the agency and its
    unions and bargaining units. This includes negotiating and administering labor
    contracts and collective bargaining agreements; managing negotiated grievances;
    and participating in negotiated third party proceedings.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-247-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '247'
  level: Service
  parent_code: null
  name: Health Care Administration
  description: Health Care Administration assures that federal health care resources
    are expended effectively to ensure quality, safety, and efficiency. This includes
    managing health care quality, cost, workload, utilization, and fraud/abuse efforts.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-248-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '248'
  level: Service
  parent_code: null
  name: Health Care Delivery Services
  description: Health Care Delivery Services provides and supports the delivery of
    health care to its beneficiaries. This includes assessing health status; planning
    health services; ensuring quality of services and continuity of care; and managing
    clinical information and documentation. It can include aid to family with children,
    immunization programs, and child support enforcement.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-249-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '249'
  level: Service
  parent_code: null
  name: Health Care Research and Practitioner Education
  description: Health Care Research and Practitioner Education fosters advancement
    in health discovery and knowledge. This includes developing new strategies to
    handle diseases; promoting health knowledge advancement; identifying new means
    for delivery of services, methods, decision models and practices; making strides
    in quality improvement; managing clinical trials and research quality; and providing
    for practitioner education.
  locator:
    page: 9
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-251-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '251'
  level: Service
  parent_code: null
  name: Staffing and Recruiting
  description: 'Staffing and Recruiting establishes procedures for attracting and
    selecting high‐quality, productive employees with the right skills and competencies,
    in accordance with merit system principles. This includes: establishing an applicant
    evaluation approach (which may include drug and alcohol testing); announcing
    the vacancy, sourcing and evaluating candidates against the competency requirements
    for the position; initiating pre‐employment activities; and hiring employees.'
  locator:
    page: 10
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-254-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '254'
  level: Service
  parent_code: null
  name: Employee Benefits and Compensation
  description: 'Employee Benefits and Compensation designs, develops, and implements
    benefits and compensation programs that attract, retain and fairly compensate
    agency employees. This Service includes: establishing and communicating benefits
    programs; processing benefits actions; and interacting as necessary with third
    party benefits providers. It also includes: developing and implementing compensation
    programs; administering bonus and monetary awards programs; administering pay
    changes; managing time, attendance, leave and pay; and managing payroll. In addition,
    designs, develops, and implements pay for performance compensation programs to
    recognize and reward high performance, with both base pay increases and performance
    bonus payments.'
  locator:
    page: 10
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-255-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '255'
  level: Service
  parent_code: null
  name: Employee Performance Management
  description: Employee Performance Management designs, develops, and implements
    a comprehensive performance management approach to ensure agency employees are
    demonstrating competencies required of their work assignments. Design, develop
    and implement a comprehensive performance management strategy that enables managers
    to make distinctions in performance and links individual performance to agency
    goal and mission accomplishment. This Service also includes managing employee
    performance at the individual level and evaluating the overall effectiveness
    of the agency’s employee development approach.
  locator:
    page: 10
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-256-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '256'
  level: Service
  parent_code: null
  name: Employee Relations
  description: 'Employee Relations designs, develops, and implements programs that
    strive to maintain an effective employer‐employee relationship that balance the
    agency’s needs against its employees’ rights. This Service includes: addressing
    employee misconduct; addressing employee performance problems; managing administrative
    grievances; providing employee accommodation; administering employees assistance
    programs; participating in administrative third party proceedings; and determining
    candidate and applicant suitability.'
  locator:
    page: 10
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-257-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '257'
  level: Service
  parent_code: null
  name: Separation Management
  description: Separation Management conducts efficient and effective employee separation
    programs that assist employees in transitioning to non‐Federal employment; facilitates
    the removal of unproductive, non‐performing employees; and assists employees
    in transitioning to retirement.
  locator:
    page: 10
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-260-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '260'
  level: Service
  parent_code: null
  name: Tax and Fiscal Policy
  description: Tax and Fiscal Policy encompasses analysis of the implications for
    economic growth and stability in the United States and the world of Federal tax
    and spending policies. This includes assessing the sustainability of current
    programs and policies, the best means for raising revenues, the distribution
    of tax liabilities, and the appropriate limits on debt.
  locator:
    page: 11
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-263-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '263'
  level: Service
  parent_code: null
  name: System and Network Monitoring
  description: System and Network Monitoring supports all activities related to the
    real‐time monitoring of systems and networks for optimal performance.
  locator:
    page: 11
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-271-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '271'
  level: Service
  parent_code: null
  name: Educational Excellence
  description: Educational Excellence refers to activities undertaken by the US Government
    to evaluate educational programs, collect data on America’s schools, and disseminate
    information and research
  locator:
    page: 11
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-272-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '272'
  level: Service
  parent_code: null
  name: Energy Technology Development
  description: Energy Technology Development encompasses the activities that apply
    the results of scientific research to design, develop, and test new technologies,
    components, and processes. This service focuses on the development of prototypes
    and pilots for wide‐scale technologies and components that can be mass produced
    by private‐sector partners. The fabrication of one‐time components used in very
    specific research techniques is an activity within the General Sciences and Innovation
    LOB.
  locator:
    page: 11
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-279-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '279'
  level: Service
  parent_code: null
  name: Battlespace Networks
  description: Battlespace Networks includes activities that extend “commercial like”
    IT Infrastructure to meet the connectivity and interoperability needs of deployed
    and mobile warfighting capabilities. This function focuses on information transport;
    and computing and enterprise services capabilities for the tactical edge users.
    It includes tactical edge networks and gateways to enable end‐to‐end connectivity
    between battlespace networks and IT infrastructure capabilities.
  locator:
    page: 11
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-280-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '280'
  level: Service
  parent_code: null
  name: Command and Control
  description: Command and Control includes activities that facilitate the exercise
    of authority and direction by a properly designated commander or decision maker
    over assigned and attached forces and resources in the accomplishment of the
    mission. It includes activities to align or synchronize interdependent and disparate
    entities to achieve unity of effort, understand information about the environment
    and situation to aid in decision making, establish a framework and select a course
    of action to employ resources to achieve a desired outcome/effect; and observe
    and assess events/effects of a decision.
  locator:
    page: 11
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-281-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '281'
  level: Service
  parent_code: null
  name: Force Application
  description: Force Application includes activities to integrate the use of maneuver
    and engagement in all environments, to create the effects necessary for achieving
    DoD mission objectives. Maneuver is the ability to move to a position of advantage
    in all environments in order to generate or enable the generation of effects
    in all domain and the information environment. Engagement is the ability to use
    kinetic and non‐kinetic means in all environments to generate the desired lethal
    and/or non‐lethal effects from all domains and the information environment.
  locator:
    page: 12
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-282-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '282'
  level: Service
  parent_code: null
  name: Protection
  description: Protection involves Citizen Protection, Leadership Protection and
    Property Protection; it involves all activities performed to protect the general
    population of the United States, president, vice‐president, their families, foreign
    leaders and dignitaries, and other high‐level government officials from criminal
    activity and entails all activities performed to ensure the security of civilian
    and government property as well as foreign diplomatic missions.
  locator:
    page: 12
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-283-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '283'
  level: Service
  parent_code: null
  name: Force Protection
  description: 'Refers to activities to prevent and/or mitigate adverse effects of
    attacks on personnel (combatant or non‐combatant) and physical assets of the
    United States, its allies and friends. This encompasses, but is not limited to:
    air and missile defense operations, strategic nuclear deterrent and prevention
    of non‐kinetic attacks; mitigation of chemical, biological, radiological, nuclear,
    electromagnetic pulse and other lethal/non‐effects; and military support to civil
    defense activities.'
  locator:
    page: 12
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-284-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '284'
  level: Service
  parent_code: null
  name: Force Training
  description: Force Training includes activities to develop, enhance, adapt and
    sustain the capacity to perform specific functions and tasks, during and in preparation
    for wartime and conflicts, in order to improve the individual or collective performance
    of personnel, units, forces, and staffs. These activities include, but are not
    limited to, unit force training; and training in operating weapon systems. This
    does not include general professional development or training.
  locator:
    page: 12
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-301-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '301'
  level: Service
  parent_code: null
  name: Force Allocation
  description: Force Allocation includes Application and Management; activities to
    integrate the use of maneuver and engagement in all environments, to create the
    effects necessary for achieving mission objectives and activities to integrate
    new and existing human and technical assets from across the Total Force and its
    mission partners, during and in preparation for wartime and conflicts, to make
    the right capabilities available at the right time/place to support national
    security.
  locator:
    page: 12
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-302-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '302'
  level: Service
  parent_code: null
  name: Nuclear Weapons Stockpile Oversight
  description: Nuclear Weapons Stockpile and Oversight includes all processes around
    the counting, tracking, transferring, securing, and decommissioning of various
    weapons that contain nuclear materials.
  locator:
    page: 12
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-303-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '303'
  level: Service
  parent_code: null
  name: Social Security Benefits
  description: Social Security Benefits includes all direct transfers to Individuals
    and involves the disbursement of funds from the federal government directly to
    beneficiaries who satisfy federal eligibility requirements with no restrictions
    imposed on the recipient as to how the money is spent. Purposes include Retirement,
    Survivors, and Old Age/ Supplemental Security Income (needs‐based).
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-304-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '304'
  level: Service
  parent_code: null
  name: Immigration and Naturalization
  description: 'Immigration and Naturalization includes all activities for tracking
    and granting of official status on all non‐native non‐US citizens, including:
    refugees, naturalized citizens, legal and illegal immigrants.'
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-306-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
  document_sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
  code: '306'
  level: Service
  parent_code: null
  name: Arms Control
  description: Arms Control includes all activities for managing both legal and illegal
    weapons in accordance with State, Federal and international law.
  locator:
    page: 13
  rights_status: us-government-work
- id: INV-FEAF-BRM-SCD-308-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-service-codes-and-definitions
