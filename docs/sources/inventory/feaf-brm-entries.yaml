  level: Service
  parent_code: B07.551
  name: Population Health Management
  description: Population Health Management assesses health indicators as a means
    to protect and promote the health of the general population. This includes monitoring
    of health, health planning, and health management of humans, animals, animal
    products, and plants, as well as tracking the spread of diseases and pests. Also
    includes evaluation of consumer products, drug, and foods to assess the potential
    risks and dangers; education of the consumer and the general population; and
    facilitation of health promotion and disease and injury prevention.
