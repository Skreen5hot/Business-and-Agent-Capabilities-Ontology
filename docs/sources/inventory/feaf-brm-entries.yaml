  code: B10.808.381
  level: Service
  parent_code: B10.808
  name: Community Deployed Resources
  description: Community Deployed Resources are focused on planning and providing
    deployed personnel and technology resources to the customer base of the enterprise
    as needed.
  locator:
    page: 46
  mission_sector_as_stated: General Government
  business_function_as_stated: Other general government
  rights_status: us-government-work
