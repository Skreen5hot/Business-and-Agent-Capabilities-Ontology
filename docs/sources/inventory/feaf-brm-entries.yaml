  name: Mapping / Geospatial
  description: Provide for the representation of mapping and geospatial information
    through the use of attributes such as zip code, country code, elevation, natural
    features and other spatial measures.
  locator:
    page: 46
  mission_sector_as_stated: General Government
  business_function_as_stated: Other general government
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.810.121-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.810.121
  level: Service
  parent_code: B10.810
  name: Security Management
  description: 'Security Management involves the physical protection of an organization’s
    personnel, assets, and facilities (including security clearance management).
    Note: Activities related to securing data and information systems are addressed
    under additional Services in the "810‐Cyber security management" Function.'
  locator:
    page: 40
  mission_sector_as_stated: General Government
  business_function_as_stated: General property and records management
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.810.315-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.810.315
  level: Service
  parent_code: B10.810
  name: Threat and Vulnerability Management
  description: Threat and Vulnerability Management involves all functions pertaining
    to the protection of federal information and information systems from unauthorized
    access, use, disclosure, disruptions, modification, or destruction, as well as
    the creation and implementation of security policies, procedures and controls.
    It includes all risk and controls tracking for IT systems.
  locator:
    page: 47
  mission_sector_as_stated: General Government
  business_function_as_stated: Cyber security management
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.810.316-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.810.316
  level: Service
  parent_code: B10.810
  name: Continuous Monitoring
  description: Continuous Monitoring includes all activities related to the real‐time
    monitoring of security controls employed within or inherited by a system. (see
    Appendix G of NIST Special Publication 800‐37)
  locator:
    page: 47
  mission_sector_as_stated: General Government
  business_function_as_stated: Cyber security management
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.810.317-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.810.317
  level: Service
  parent_code: B10.810
  name: Data Integrity and Privacy Management
  description: Data Integrity and Privacy Management involves the coordination of
    data collection, storage, dissemination, and destruction as well as managing
    the policies, guidelines, and standards regarding data management, so that data
    quality is maintained and information is shared or available in accordance with
    the law and best practices
  locator:
    page: 47
  mission_sector_as_stated: General Government
  business_function_as_stated: Cyber security management
  rights_status: us-government-work
