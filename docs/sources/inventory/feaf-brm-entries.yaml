    integrate the use of maneuver and engagement in all environments, to create the
    effects necessary for achieving mission objectives and activities to integrate
    new and existing human and technical assets from across the Total Force and its
    mission partners, during and in preparation for wartime and conflicts, to make
    the right capabilities available at the right time/place to support national
    security.
