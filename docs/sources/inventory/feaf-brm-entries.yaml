  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.805.256
  level: Service
  parent_code: B10.805
  name: Employee Relations
  description: 'Employee Relations designs, develops, and implements programs that
    strive to maintain an effective employer‐employee relationship that balance the
    agency’s needs against its employees’ rights. This Service includes: addressing
    employee misconduct; addressing employee performance problems; managing administrative
    grievances; providing employee accommodation; administering employees assistance
    programs; participating in administrative third party proceedings; and determining
    candidate and applicant suitability.'
  locator:
    page: 42
  mission_sector_as_stated: General Government
  business_function_as_stated: Central personnel management
  rights_status: us-government-work
