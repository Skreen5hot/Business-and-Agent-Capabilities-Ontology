  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.805.251
  level: Service
  parent_code: B10.805
  name: Staffing and Recruiting
  description: 'Staffing and Recruiting establishes procedures for attracting and
    selecting high‐quality, productive employees with the right skills and competencies,
    in accordance with merit system principles. This includes: establishing an applicant
    evaluation approach (which may include drug and alcohol testing); announcing
    the vacancy, sourcing and evaluating candidates against the competency requirements
    for the position; initiating pre‐employment activities; and hiring employees.'
  locator:
    page: 41
  mission_sector_as_stated: General Government
  business_function_as_stated: Central personnel management
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.805.254-brm-service
  kind: brm-service
  register: SRC-GOV-06
  document: brm-3.1-taxonomy
  document_sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
  code: B10.805.254
  level: Service
  parent_code: B10.805
  name: Employee Benefits and Compensation
  description: 'Employee Benefits and Compensation designs, develops, and implements
    benefits and compensation programs that attract, retain and fairly compensate
    agency employees. This Service includes: establishing and communicating benefits
    programs; processing benefits actions; and interacting as necessary with third
    party benefits providers. It also includes: developing and implementing compensation
    programs; administering bonus and monetary awards programs; administering pay
    changes; managing time, attendance, leave and pay; and managing payroll. In addition,
    designs, develops, and implements pay for performance compensation programs to
    recognize and reward high performance, with both base pay increases and performance
    bonus payments.'
  locator:
    page: 41
  mission_sector_as_stated: General Government
  business_function_as_stated: Central personnel management
  rights_status: us-government-work
- id: INV-FEAF-BRM-TAX-B10.805.255-brm-service
