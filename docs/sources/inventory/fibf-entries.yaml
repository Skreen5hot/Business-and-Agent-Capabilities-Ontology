    and compare cost of authorized transportation to traveler's actual "out-of-channel"
    transportation expense; Determine and document traveler's use of cash to pay
    for non-contract passenger services for common carrier transportation information;
    Determine and calculate privately owned vehicle (POV) mileage reimbursement information;
