  level: Activity
  parent_code: TRT.010
  parent_from: row
  name: Travel Reservation Assistance and Processing
  description: Search for and identify transportation reservation information; Select
    transportation reservation information; Evaluate transportation reservation information
    (e.g., exception for contract city-pair fare, exception for coach-class accommodation);
    Translate common carrier fare basis code into terminology consistent with FTR;
    Calculate and document carbon footprint information; Search for and identify
    lodging reservation information; Select lodging reservation information; Evaluate
    exception information warranting reimbursement on an actual expenses basis; Search
    for and identify available lodging with rates above per diem at temporary duty
    (TDY) location(s) information; Search for and identify available lodging at alternate
    location(s) when lodging is not available at the temporary duty (TDY) location;
    Identify, apply, and document unused, partially used, or downgraded/exchanged
    ticket information; Identify, apply, and document promotional materials and frequent
    traveler benefits information; Develop and document travel reservation/updated
    reservation and fee information; Evaluate travel reservation/updated reservation
    information for completeness, errors, and compliance; Revise travel reservation/updated
    reservation to correct deficiencies, errors, and compliance issues; Develop and
    document notification to traveler of common carrier/commercial transportation
    schedule change(s) information; Develop and document updated reservation information;
    Cancel reservation information associated with canceled trip
  locator:
    sheet: Functions & Activities
    row: 3
  draft: false
  rights_status: us-government-work
