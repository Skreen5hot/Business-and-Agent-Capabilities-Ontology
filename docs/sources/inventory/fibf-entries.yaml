  level: Activity
  parent_code: TRT.010
  parent_from: row
  name: Temporary Duty (TDY) and Local Travel Authorization Processing
  description: Develop and document information concerning agency acceptance of payment
    for expenses from non-Federal source(s); Obtain authorization for reservation
    assistance and develop and document reservation information when it is not practicable
    or possible to obtain written or electronic authorization prior to travel; Identify
    and document travel reservation/updated reservation information associated with
    the travel authorization; Determine, document, and calculate use of Government
    aircraft information; Determine and document privately owned vehicle (POV) mileage
    rate information; Compare constructive cost and other factor information; Determine
    and document per diem rate information; Calculate and document per diem information
    when crossing the International Dateline (IDL); Calculate and document actual
    expense information; Calculate and document estimated miscellaneous and other
    expense information; Calculate and document estimated total travel costs information;
    Determine and document travel advance information; Determine and document accounting
    classification information, to include amount and allocation percentage; Develop
    and document authorization information; Submit, route, and document travel authorization
    information for approval; Evaluate travel authorization information, route for
    review, and record results; Return unapproved travel authorization to traveler/travel
    arranger with identified issues; Develop and document request for funds availability
    check for travel authorization; Approve, date, and sign travel authorization;
    Develop and document approved travel authorization information changes; Determine
    and document travel authorization status information; Cancel and evaluate canceled
    travel authorization; Determine and document funds deobligation request information
    for the canceled travel authorization
  locator:
