# Capability Term Inventory, Phase I-2a: the rights review.
#
# For each source and edition in I-2's scope: what the rights holder's
# terms permit, from primary evidence pinned by digest, and the decision
# points the architect has to settle before I-2b (APQC PCF) and I-2c
# (FEAF-II BRM, FIBF) write any catalog text.
#
# This file is a review, not a decision. The posture is the architect's
# act, recorded in docs/decisions/ and pointed to from each source's
# `architect_decision` (since 2026-10-28, docs/decisions/2026-10-28-i2a-decided.md). It is also not catalog content: no PCF, BRM
# or FIBF name, description, code or hierarchy appears in it, and quotes
# are limited to the operative words of a notice, at most 15 words each.
#
# Hand-written, and checked by tools/inventory/rights.py (offline by
# default; --confirm refetches every pinned document and requires its
# digest). The downloaded documents are in .upstream-cache/i2a/, which is
# gitignored; none of them is committed.

format: 1
review: I-2a
authority: docs/decisions/2026-10-28-i2-and-bpo-repin-decided.md
proposal: docs/proposals/2026-10-28-inventory-i2-public-catalogs.md
prepared:
  by: Claude Code (claude-opus-5-5), for the architect's review
  date: 2026-10-28
scope_note: >-
  Decision E2 asks for the actual APQC terms and attribution requirements
  per edition; E3 lets the PCF 8.0 file be absent; E5 asks for the exact
  FIBF documents and editions a harvest snapshot would include, pinned;
  E6 asks for the primary BRM 3.1 documents, validated and pinned, with
  their redistribution rights, or a recorded gap. Part C bars publishing
  further restricted catalog material and minting anything. An edition
  is identified here by the bytes pinned: where a publisher keeps a
  version number inside a document, I-2b or I-2c records it from the
  same bytes. Nothing was sent to any rights holder.

sources:

  # ====================================================================
  - id: apqc-pcf-7.4
    register: SRC-IND-01
    rightsholder: APQC (American Productivity & Quality Center), Houston, Texas
    work: APQC Process Classification Framework (PCF), Cross-Industry
    edition: "7.4"
    status: evidence-complete
    terms: ambiguous
    gap_reason: null
    evidence:
      - id: apqc74-workbook
        kind: bpo-git-blob
        repository: https://github.com/Skreen5hot/BusinessProcessOntology
        commit: bc64e91839378e1926189c01bf184d6a22d5c1b7
        path: "K014749_APQC Process Classification Framework (PCF) - Cross-Industry - Excel Version 7.4.xlsx"
        sha256: 0e6e24b6cabe795cee9aa0a23912bd323257e419eb96a74a17ad328a08f97d24
        bytes: 1145519
        retrieved: 2026-10-28
        members:
          - member: xl/drawings/drawing3.xml
            sha256: 9bde3d72a66495f0c2574181819f01352a4715cd70362ef210d9473ea58c05f7
          - member: xl/worksheets/sheet19.xml
            sha256: 6c6f5c3547c601281bc8bf3b9d23b30d5134d64b122eb18037f4c3fe5ec5ef40
          - member: xl/worksheets/sheet2.xml
            sha256: 259fd4c8acc76c7f0085edeaff46d57f535769dbc49f75ab0c5a55a4bd1b8454
          - member: xl/drawings/drawing1.xml
            sha256: c3cb3755071815ad46c80aff2be117364c18ce92a371e094b537fc0912c32c83
        checked: >-
          APQC's own Excel export as BPO committed it, read from the local
          BPO clone's git objects (never edited) and parsed as zip/XML data.
          drawing1 (Introduction sheet) states cross-industry version 7.4,
          generated 6 August 2024. drawing3 is the last sheet, Copyright and
          attribution: an APQC description, then a 2024 APQC copyright line
          with all rights reserved, then a grant of rights (quoted below).
          Sheet footers: 17 sheets carry a 2024 APQC copyright line; the
          About sheet (sheet2, an explanatory page on reading the file)
          carries a 2014 copyright line naming APQC and IBM; the Metrics
          sheet carries none. The Combined sheet's columns include element
          descriptions as well as names, ids and hierarchy ids, so the
          workbook is evidence for all three. No other licence text is in
          the file, and BPO states none (I-1, config/inventory-sources.yaml).
      - id: apqc-terms-of-service
        kind: browser-text
        url: https://www.apqc.org/terms-of-service
        sha256: 2ed517dff2f3db5c7683d8d5b8b787cc519beb1c282edf7ca6d541e5b5364483
        bytes: 12861
        retrieved: 2026-10-28
        normalisation: >-
          The textContent of the page's main element, every run of
          whitespace replaced by one space, leading and trailing space
          removed, encoded as UTF-8; digested in the page with
          crypto.subtle at 2026-10-28T06:46:37Z.
        why_not_refetched: >-
          apqc.org answers scripted clients with a Cloudflare challenge
          (HTTP 403), which this review does not bypass, and these Terms
          forbid automated access. The page was read once in the desktop
          app's browser pane, which passed without any challenge being
          shown; a reviewer can reproduce the digest in a browser console.
        checked: >-
          APQC Terms of Service, last modified July 2026. They govern APQC's
          Online Resources (the website and Resource Library, from which the
          PCF is downloaded) and all other APQC products. A limited licence
          for internal process improvement within your organization; no
          public display, reproduction, publication or distribution of any
          part except as an applicable APQC membership or license agreement
          permits; a list of improper uses that includes automated download
          or access and using the resources to create, train or test AI or
          machine-learning systems; another written agreement with APQC (a
          license agreement is the example given) controls over these Terms
          where they conflict; a copyright notice covering structure,
          selection and arrangement. The Terms do not mention the PCF by
          name or the PCF's own notice.
    unpinned_observations:
      - url: https://www.apqc.org/process-frameworks
        retrieved: 2026-10-28
        observed: >-
          APQC's PCF page offers the Cross-Industry PCF in Excel and PDF,
          names Excel 8.0 as the latest version, and links the download
          through APQC's Resource Library. It states no licence terms for
          the PCF; its footer links the Terms of Service above.
        why_unpinned: >-
          Read in the browser pane before the Terms of Service were read;
          its text was not digested. Once the Terms' clause on automated
          access was read, no further apqc.org page was opened, including
          the 8.0 download listing.
      - url: https://www.apqc.org/process-frameworks/pcf-faqs
        retrieved: 2026-10-28
        observed: >-
          APQC's PCF FAQ says the latest version is 8.0 and that APQC
          supports all versions; it encourages organizations to adapt and
          rename PCF elements while keeping the element ids. It states no
          licence or redistribution terms.
        why_unpinned: Read in the browser pane, not digested (as above).
    findings:
      names: >-
        The notice inside the 7.4 file grants a perpetual, worldwide,
        royalty-free licence to use, copy, publish, modify and create
        derivative works of the PCF, on the single condition that every copy
        and derivative work carries the notice. On its own terms that covers
        republishing element names as source evidence. APQC's current
        website Terms forbid publishing or distributing any part of its
        Online Resources unless an APQC licence agreement permits it; they
        do not say whether the PCF's own notice is such an agreement, though
        their conflict clause gives a licence agreement precedence.
      descriptions: >-
        As for names: the same notice covers the whole PCF, and the 7.4
        workbook carries element descriptions alongside the names. The same
        unresolved interaction with the website Terms applies. The separate
        process-definition documents APQC sells or offers to members are not
        in hand and are not covered by this finding.
      codes_and_hierarchy: >-
        Element ids and hierarchy ids are identifiers; APQC itself
        encourages keeping element ids when an organization renames
        elements. The arrangement of the hierarchy is part of the PCF the
        notice licenses, and the website Terms claim structure, selection
        and arrangement. So codes and hierarchy are no freer than names
        under the website Terms, and no less free under the notice; the
        lowest-risk use is ids alone.
      derivative_works: >-
        Expressly licensed by the notice (modify and create derivative
        works), subject to the notice travelling with the derivative work.
        An inventory entry, BPO's ontology, and a page of this repository's
        public site that shows PCF-derived text would each be derivative
        works or copies.
      attribution:
        required: true
        summary: >-
          Every copy and every derivative work must contain a copy of the
          notice itself, which is the 2024 APQC copyright line and the grant
          (about sixty words). A citation alone does not satisfy it; the
          notice text has to be reproduced, which the grant itself permits.
          Where text appears on the public site as well as in the
          repository, the notice has to reach the site too.
        locators:
          - apqc74-workbook, sheet Copyright and attribution (xl/drawings/drawing3.xml)
          - apqc74-workbook, every sheet footer except About and Metrics
      restrictions:
        - >-
          APQC's website Terms (July 2026) bar public reproduction or
          distribution of any part of the Online Resources unless an APQC
          licence agreement permits it, and give such an agreement
          precedence. Whether the PCF notice is that agreement is the
          central open question.
        - >-
          The website Terms bar using the Online Resources to create, train
          or test AI or machine-learning systems. This repository is built
          with an AI coding agent and models agent capabilities; whether
          either is within the clause is not stated.
        - >-
          The website Terms bar automated download or access; any future
          retrieval of APQC files is by the architect, by hand.
        - >-
          Trademarks: APQC marks Process Classification Framework and PCF
          as registered. The notice licenses copyright only; naming the PCF
          to identify it is ordinary citation, but no use may suggest APQC
          endorses BCO.
        - >-
          The About sheet carries a 2014 copyright line shared with IBM; the
          notice licenses the PCF, not that explanatory page, which no phase
          needs.
    quotes:
      - evidence: apqc74-workbook
        locator: sheet Copyright and attribution, xl/drawings/drawing3.xml, the grant
        quote: a perpetual, worldwide, royalty-free license to use, copy, publish, modify, and create derivative works
      - evidence: apqc74-workbook
        locator: sheet Copyright and attribution, xl/drawings/drawing3.xml, the condition
        quote: all copies of the PCF and any derivative works contain a copy of this notice
      - evidence: apqc-terms-of-service
        locator: Terms of Service, Limited License
        quote: you may not publicly display, perform, reproduce, publish, license, transfer, sell, or distribute any part
      - evidence: apqc-terms-of-service
        locator: Terms of Service, opening paragraph, on conflicts with other agreements
        quote: the terms of that other agreement shall control
      - evidence: apqc-terms-of-service
        locator: Terms of Service, Use of Online Resources
        quote: create, train, or test any large language models or other artificial intelligence
    open_questions:
      - >-
        Is the PCF's in-file notice an APQC licence agreement within the
        website Terms, so that its grant (publish, derivative works)
        controls over the Terms' bar on public distribution?
      - >-
        Does the grant reach a public, non-commercial ontology repository
        and its public site that redistribute PCF names, descriptions, ids
        and hierarchy as cited source evidence, with the notice reproduced
        in a NOTICE file and on each site page that shows PCF text?
      - >-
        Does the grant flow to people who receive the PCF from such a
        repository (or from BPO) without registering with APQC?
      - >-
        Is using the PCF in an ontology built with an AI coding assistant,
        and describing agent capabilities, within the Terms' bar on
        creating, training or testing AI systems?
      - >-
        Is one copy of the notice per published file (and per site page)
        enough, or does APQC expect it on each entry?
    decision_points:
      - id: APQC-1
        question: >-
          What may I-2b (and, under E7, a later PR on I-1's withheld
          entries) publish from PCF 7.4?
        options:
          - key: a
            option: >-
              Rely on the in-file grant now: names, descriptions, ids and
              hierarchy, with the full notice reproduced in NOTICE.md and on
              every site page that shows PCF text.
          - key: b
            option: >-
              Ids and hierarchy positions only (names and descriptions
              withheld, as in I-1) until APQC answers in writing; then
              widen to (a) if the answer allows.
          - key: c
            option: >-
              Citation only: no PCF-derived entries in the public
              repository; I-2b keeps its work outside the repository.
        recommendation: >-
          (b), with the clarification request sent. The in-file grant is
          broad and clear on its own; the conflict is with APQC's later
          website Terms, and the AI clause is unaddressed. Waiting costs
          I-2b its names, not its structure, and a written answer would
          settle both I-2b and E7.
      - id: APQC-2
        question: >-
          Send the drafted clarification request
          (docs/proposals/2026-10-28-apqc-clarification-request.md) to APQC?
        options:
          - key: a
            option: Authorize sending it, as drafted or amended.
          - key: b
            option: Do not send; decide APQC-1 on the evidence as it stands.
        recommendation: >-
          (a). The communications protocol applies; sending is the
          architect's act.
    architect_decision:
      record: docs/decisions/2026-10-28-i2a-decided.md

  # ====================================================================
  - id: apqc-pcf-8.0
    register: SRC-IND-01
    rightsholder: APQC (American Productivity & Quality Center), Houston, Texas
    work: APQC Process Classification Framework (PCF), Cross-Industry
    edition: "8.0 (24 March 2026)"
    status: gap
    terms: not-established
    gap_reason: >-
      The 8.0 file is not in hand: it is downloaded from APQC's Resource
      Library, which needs a registration this review may not create (E3).
      Its in-file notice cannot be read without it, and the 7.4 notice
      cannot be assumed to carry over. Closed when the architect downloads
      8.0 under his registration and its notice (sheet and footers) is
      pinned here by digest, the file itself staying outside the
      repository unless that notice permits redistribution.
    evidence:
      - id: apqc-terms-of-service-for-8.0
        kind: browser-text
        url: https://www.apqc.org/terms-of-service
        sha256: 2ed517dff2f3db5c7683d8d5b8b787cc519beb1c282edf7ca6d541e5b5364483
        bytes: 12861
        retrieved: 2026-10-28
        normalisation: As apqc-pcf-7.4 / apqc-terms-of-service.
        why_not_refetched: As apqc-pcf-7.4 / apqc-terms-of-service.
        checked: >-
          The only publicly reachable terms that would govern obtaining 8.0.
          Downloading it means registering and accepting these Terms, so
          their bar on public distribution and their AI clause apply to 8.0
          at least as much as to 7.4.
    unpinned_observations:
      - url: https://www.apqc.org/process-frameworks
        retrieved: 2026-10-28
        observed: >-
          Excel 8.0 is offered as the latest Cross-Industry PCF, through
          the Resource Library.
        why_unpinned: >-
          Not digested (see apqc-pcf-7.4). The 8.0 download listing page
          was not opened, so no 8.0-specific statement of terms was seen.
    findings:
      names: Not established; depends on the notice inside the 8.0 file.
      descriptions: Not established; as for names.
      codes_and_hierarchy: >-
        Not established. Element ids persist across editions by APQC's own
        account, so the delta can be keyed by id once the file is in hand.
      derivative_works: Not established; as for names.
      attribution:
        required: true
        summary: >-
          Presumed at least the 7.4 requirement (the notice travels with
          copies and derivative works) until the 8.0 notice is read.
        locators:
          - apqc-pcf-7.4 / apqc74-workbook, as the prior edition's notice
      restrictions:
        - The website Terms, as for 7.4, apply to obtaining the file.
    quotes: []
    open_questions:
      - Does the 8.0 workbook carry the same grant as 7.4, a narrower one, or none?
      - The open questions of 7.4 apply to 8.0 as well.
    decision_points:
      - id: APQC80-1
        question: How is the 8.0 gap closed?
        options:
          - key: a
            option: >-
              The architect downloads 8.0 under his registration and gives
              its notice to I-2a (an amendment to this record), before I-2b
              writes the delta.
          - key: b
            option: >-
              Defer the 8.0 delta; I-2b covers 7.4 only, and 8.0 waits for
              the APQC answer.
        recommendation: >-
          (a) for the notice, which is small and settles the edition
          question; the delta itself follows APQC-1.
    architect_decision:
      record: docs/decisions/2026-10-28-i2a-decided.md

  # ====================================================================
  - id: feaf-brm-3.1
    register: SRC-GOV-06
    rightsholder: >-
      United States Government, Office of Management and Budget (Executive
      Office of the President)
    work: Federal Enterprise Architecture Business Reference Model (BRM)
    edition: 3.1, with its taxonomy (both dated 15 May 2013)
    status: evidence-complete
    terms: unambiguous
    gap_reason: null
    evidence:
      - id: omb-fea-archive-page
        kind: url
        url: https://obamawhitehouse.archives.gov/omb/e-gov/FEA
        sha256: c7c726cd3af8bfa8cf76fcd6549aff70c201bf56f7d1c6a3628b60b336c8f538
        bytes: 28651
        retrieved: 2026-10-28
        checked: >-
          The archived OMB Federal Enterprise Architecture page on the
          National Archives' frozen copy of the 2009-2017 White House site,
          under Office of Management and Budget. Under FEA Reference Models
          it lists Business Reference Model version 3.1 (May 15, 2013) and
          Business Reference Model version 3.1 Taxonomy (May 15, 2013), each
          a PDF under OMB's egov_docs path, as the architect stated; also the
          Common Approach (2 May 2012) and FEAF version 2 (29 January 2013).
          Identical bytes on two fetches.
      - id: brm-3.1-service-codes-and-definitions
        kind: url
        url: https://obamawhitehouse.archives.gov/sites/default/files/omb/assets/egov_docs/brm_v3-1-service_codes_and_definitions_rev1_20130615.pdf
        sha256: 249c5fc0ed745aafc6d6cf180b7781b576b6842e2efd71a22e059d5687c48208
        bytes: 196421
        retrieved: 2026-10-28
        checked: >-
          The document the archive page links as BRM version 3.1. Its page
          header reads Business Reference Model v3.1, Service Codes and
          Definitions, May 15, 2013; 24 pages; produced with Acrobat
          Distiller, created 7 June 2013 (XMP). The file name carries rev1
          and 20130615, later than the stated date: a revision posted in
          June of the May edition. The text names no issuing body (identity
          rests on the OMB page that links it). No copyright, licence,
          trademark or proprietary notice; it cites federal sources (OMB,
          GAO, FASAB, NIST) by name only.
      - id: brm-3.1-taxonomy
        kind: url
        url: https://obamawhitehouse.archives.gov/sites/default/files/omb/assets/egov_docs/brm_v3-1_taxonomy_20130615.pdf
        sha256: 52ccabf3a3e7970b4265c79f116652447a228664e31db019f9eac384fe0fa9ce
        bytes: 996966
        retrieved: 2026-10-28
        checked: >-
          The document the archive page links as the BRM 3.1 taxonomy. Its
          pages read Appendix H, Business Reference Model Taxonomy with
          Definitions, May 15, 2013, 52 pages, created 6 June 2013. It is an
          appendix by its own heading, but does not name the document it
          belongs to (FEAF v2, listed on the same archive page, is the
          likely parent; not verified).
          It states a three-layer structure (mission sectors, business
          functions, services) aligned to OMB Circular A-11 budget function
          codes. No issuing body named in the text; no copyright, licence,
          trademark or proprietary notice.
      - id: wh-archive-copyright-policy
        kind: url
        url: https://obamawhitehouse.archives.gov/copyright
        sha256: 8cf74b4897c9a6e6e5b99d6e6f9290c01c69ec1a3fa2e8ebdcd26fe879e867d4
        bytes: 27549
        retrieved: 2026-10-28
        checked: >-
          The archived site's copyright policy: government-produced material
          on the site is not copyright protected; the Government may hold
          copyrights transferred to it; third-party content is, unless
          noted, under Creative Commons Attribution 3.0 US. Identical bytes
          on two fetches.
    findings:
      names: >-
        Free to redistribute. Both documents are works of OMB, a federal
        agency, published on the Government's own archived site, which
        states that government-produced material there is not under
        copyright (17 U.S.C. 105). Neither carries any third-party notice.
      descriptions: Free to redistribute, on the same evidence.
      codes_and_hierarchy: Free to redistribute, on the same evidence.
      derivative_works: Unrestricted for a US Government work.
      attribution:
        required: false
        summary: >-
          No attribution is legally required for a US Government work.
          Citing OMB, the document, its date and the archive URL is good
          practice, and is what the inventory's provenance needs anyway. A
          derivative must not imply OMB endorses it.
        locators:
          - wh-archive-copyright-policy
          - brm-3.1-service-codes-and-definitions and brm-3.1-taxonomy (no notices)
      restrictions:
        - >-
          17 U.S.C. 105 frees US Government works in the United States;
          outside it, the Government may assert copyright. No such assertion
          appears in these documents or on the archive.
        - >-
          The archive is frozen historical material; the documents are not
          maintained, and OMB's current site does not republish them. The
          BRM is dormant, as the register already records.
    quotes:
      - evidence: wh-archive-copyright-policy
        locator: Copyright Policy, first sentence
        quote: government-produced materials appearing on this site are not copyright protected
    open_questions:
      - >-
        Contractor authorship: the documents do not say who drafted them.
        A contractor-written work given to the Government can keep its
        copyright, but none is marked and the publisher states the material
        is government-produced. Recorded as a residual, not a blocker.
      - >-
        Which of the two is the BRM for I-2c: the service codes and
        definitions table, the taxonomy appendix, or both? They overlap.
    decision_points:
      - id: BRM-1
        question: Accept the BRM 3.1 documents as redistributable for I-2c?
        options:
          - key: a
            option: >-
              Accept: E6 is met (primary OMB documents, validated against the
              OMB archive listing, pinned); I-2c harvests names, definitions,
              codes and hierarchy with a citation to OMB and the archive.
          - key: b
            option: >-
              Accept the documents as primary but treat the contractor
              residual as open; harvest codes and hierarchy only.
          - key: c
            option: Defer the BRM despite the evidence.
        recommendation: >-
          (a). The primary documents are where the architect said, they are
          what they claim, and nothing in them or on the archive limits
          redistribution.
      - id: BRM-2
        question: Which document is the BRM harvest's source?
        options:
          - key: a
            option: The taxonomy appendix (structure with definitions), the other as a cross-check.
          - key: b
            option: The service codes and definitions table, the other as a cross-check.
          - key: c
            option: Both, as separate entries per document (amendment 2 style).
        recommendation: >-
          (c), because the inventory keeps sources apart and the two are
          separately listed by OMB; I-4 reconciles them.
    architect_decision:
      record: docs/decisions/2026-10-28-i2a-decided.md

  # ====================================================================
  - id: fibf-2026-10-28
    register: SRC-GOV-05
    rightsholder: >-
      United States Government: GSA (Office of Shared Solutions and
      Performance Improvement) as publisher; each domain's standards lead
      agency (for example OPM, EEOC, NARA, CISA, DOJ) as author. Most
      workbooks were prepared by The MITRE Corporation, which marks them
      with its own copyright.
    work: Federal Integrated Business Framework (FIBF), per-domain business standards
    edition: >-
      As published at ussm.gsa.gov on 2026-10-28: the documents pinned below,
      each identified by its digest. Internal version tables (by domain,
      2024 and 2025 releases) are I-2c's to record from the same bytes.
    status: evidence-complete
    terms: ambiguous
    gap_reason: null
    evidence:
      # ---- the enumeration: the FIBF index page and each domain page
      - id: fibf-index-page
        kind: url
