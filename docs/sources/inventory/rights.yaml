    excluded_from_snapshot:
      - what: Service measures workbooks (per domain) and the ERM performance measures workbook
        why: >-
          A different FIBF component (how delivery is measured), not
          functions, activities or business capabilities (E5). Not
          downloaded.
      - what: Business use case archives, business information exchanges and pre-built report workbooks
        why: >-
          Other FIBF components (use cases, data exchange, reports). Not
          downloaded.
      - what: The Download All archives per domain
        why: >-
          Bundles of the same component files; the individual files are
          pinned instead, so a digest names one document.
      - what: >-
          The FMCF-3 FFM Business Capabilities (FY 2024) PDF that the
          register cites for SRC-GOV-05
        why: >-
          Its register URL now returns HTTP 404; the financial management
          page publishes the 2025 workbooks pinned above instead. The
          register entry is out of date (a separate fix).
      - what: The domain pages for FOIA and Regulation Management
        why: >-
          Pinned above as context, but they publish no component, so no
          document from them is in the snapshot.
    findings:
      names: >-
        For the 18 workbooks with no notice (the 11 HR business capability
        lists, travel, contract writing, records management and the two IT
        and cybersecurity operational workbooks) and for the EEO page:
        US Government work, free to redistribute, subject to the
        third-party references noted below. For the 21 workbooks with a
        MITRE copyright line, all rights reserved, and a line stating
        unlimited usage rights for the Federal Government, in the printed
        footer of some or all sheets (listed per document): not
        established. The Government's unlimited rights let
        it use and release the work, and GSA has released it publicly and
        says most of its material is free of copyright; but MITRE's
        copyright is expressly asserted, the public's own right to
        redistribute is not stated, and GSA's policy tells readers to check
        notices and decide for themselves.
      descriptions: As for names; the same 21 workbooks are affected.
      codes_and_hierarchy: >-
        Function and activity identifiers and their parent-child structure
        are the least exposed part of a MITRE-marked workbook, but they are
        part of it; no FIBF document grants or withholds them separately.
      derivative_works: >-
        Unrestricted for the unmarked US Government works. For the MITRE-
        marked workbooks, as for names.
      attribution:
        required: false
        summary: >-
          None required for US Government works; citing GSA, the domain's
          standards lead, the document and its URL is the inventory's
          provenance anyway. If MITRE-marked material is redistributed, its
          copyright line should travel with it, whatever the decision on
          permission.
        locators:
          - gsa-website-policies, Reuse and copyright
          - every fibf-doc item with a notices line naming MITRE
      restrictions:
        - >-
          21 of the 39 workbooks carry a MITRE Corporation copyright line
          (2017 to 2024), with a line stating unlimited usage rights for the
          Federal Government, in the printed footer of some or all sheets.
          MITRE operates federally funded research and development centers;
          the marking is the usual one for work delivered to the Government
          under contract. Its placement is uneven: in the 11 HR lifecycle
          workbooks it is on the Service Functions sheet only, and their
          companion capability lists (the same OPM releases) carry none; in
          the financial management capability workbook it is only on the
          references sheet, whose page header names a different domain
          (travel), which suggests a reused template. Uneven or not, it is
          an express notice, and this review does not discount it.
        - >-
          The two IT and cybersecurity operational workbooks map entries to
          ITIL practice names (AXELOS/PeopleCert) and TBM Taxonomy labels
          (the TBM Council), and cite ISO/IEC and COBIT (ISACA). Those
          mapping columns are third-party material inside a federal file.
          The CVD, SOC, records management, HR analytics and financial
          management workbooks cite ISO/IEC, CMU/SEI or COBIT works by
          reference only.
        - >-
          The grants business capability workbook is macro-enabled (.xlsm).
          Any harvest reads it as data only and never runs it.
        - >-
          The pages and files are live and change: a digest that moves at
          --confirm means GSA published a new edition, which is a new
          snapshot for the architect, not a silent re-pin.
    quotes:
      - evidence: gsa-website-policies
        locator: Website policies, Reuse and copyright
        quote: free of copyright and may be copied and distributed without permission
      - evidence: gsa-website-policies
        locator: Website policies, Reuse and copyright
        quote: Check to see if there is a copyright or photo credit.
      - evidence: fibf-doc-mom-1
        locator: sheet footers (the same line, by year, in each MITRE-marked workbook)
        quote: The MITRE Corporation – all rights reserved. Federal Government – unlimited usage rights.
    open_questions:
      - >-
        Does GSA (or MITRE) confirm that the public may redistribute the
        MITRE-marked FIBF workbooks' function, activity and business
        capability text, given the Government's unlimited rights and GSA's
        public release?
      - >-
        Should the ITS and CYB operational workbooks be in the snapshot at
        all? The ITS page calls their functions and activities draft, and
        the CYB workbook folds in the CVD and SOC capabilities that the
        cybersecurity pages also publish separately.
      - >-
        The two contract-writing workbooks have the same sheet set and both
        contain functions, activities and capabilities; which is the source,
        or are both kept?
      - >-
        The EEO domain publishes its functions only in the page HTML. Is a
        web page an acceptable source document for the snapshot?
    decision_points:
      - id: FIBF-1
        question: What may I-2c publish from the MITRE-marked workbooks?
        options:
          - key: a
            option: >-
              Treat them as redistributable: a federal release of a work in
              which the Government holds unlimited rights, under GSA's reuse
              policy; carry MITRE's copyright line with the text.
          - key: b
            option: >-
              Publish identifiers and structure only from the MITRE-marked
              workbooks, and full text from the unmarked ones, until GSA
              confirms in writing.
          - key: c
            option: >-
              Exclude the MITRE-marked workbooks from I-2c until GSA
              confirms.
        recommendation: >-
          (b), with a short written question to GSA's FIBF contact if the
          architect wants (a). The marking is explicit and the public's
          right is inferred, not stated; (b) loses no structure while the
          question is open. No request to GSA is drafted here, as the brief
          asked for one only for APQC.
      - id: FIBF-2
        question: The third-party mapping columns in the ITS and CYB operational workbooks?
        options:
          - key: a
            option: Exclude the ITIL and TBM mapping columns from any harvest; keep FIBF's own fields.
          - key: b
            option: Exclude both operational workbooks from the snapshot.
          - key: c
            option: Include them as they are.
        recommendation: >-
          (a). The mappings are not functions, activities or business
          capabilities, which is all E5 asks for.
      - id: FIBF-3
        question: The snapshot's document set (E5)?
        options:
          - key: a
            option: >-
              The 39 workbooks plus the EEO page, as pinned, each domain's
              documents kept separately (duplicates kept, flagged).
          - key: b
            option: >-
              As (a), but without the draft ITS and CYB operational workbooks
              and with one contract-writing workbook.
        recommendation: >-
          (a): keep the evidence and let I-4 deduplicate, as I-1 did; the
          draft status and duplication are recorded on the entries.
    architect_decision:
      record: docs/decisions/2026-10-28-i2a-decided.md

summary_for_the_architect: >-
  APQC PCF 7.4: the workbook's own notice is a broad, clear grant (use,
  copy, publish, modify, derivative works) whose one condition is that the
  notice travels with every copy and derivative. APQC's website Terms,
  revised July 2026, cut across it: they bar public distribution of any
  part of APQC's online resources unless an APQC licence agreement permits
  it, and bar using them to create, train or test AI systems. Whether the
  in-file notice is such an agreement is not stated, so the terms are
  ambiguous for this repository's use, and a clarification request is
  drafted for your authorization (APQC-2). Recommended until APQC answers:
  ids and hierarchy only (APQC-1 b); I-1's withholding stands (E7).
  APQC PCF 8.0: a gap. The file needs your registration; its notice is
  unread, and the Terms above govern its download (APQC80-1). FEAF-II BRM
  3.1: evidence complete and unambiguous. The OMB archive lists BRM 3.1 and
  its taxonomy, both dated 15 May 2013, as you stated; both PDFs are pinned
  and match their listing; they carry no notice, and the archive states
  government-produced material is not under copyright. Recommended: accept
  for I-2c (BRM-1 a), both documents kept apart (BRM-2 c). FIBF: 25 domain
  pages and 39 functions-and-activities and business-capability workbooks
  are pinned, plus the EEO page, which is that domain's only source; FOIA
  and Regulation Management publish nothing. 21 workbooks carry a MITRE
  copyright line with unlimited rights for the Government, so the public's
  right to redistribute their text is inferred rather than stated; two IT
  workbooks embed ITIL and TBM mappings. Recommended: identifiers and
  structure from the MITRE-marked files and full text from the rest until
  GSA confirms (FIBF-1 b), the third-party mapping columns left out
  (FIBF-2 a), every document kept (FIBF-3 a). Separately, the register's
  SRC-GOV-05 URL is dead and SRC-GOV-06 cites only secondary sources; both
  are corrections for another change.
