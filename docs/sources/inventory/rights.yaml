      - id: fibf-page-cyb-cvd
        kind: url
        url: https://ussm.gsa.gov/fibf-cyb-cvd/
        sha256: d6e986b9eb95ea507fbf7750ccc0662906750fa33e4d82d347ec673fb938def0
        bytes: 79832
        retrieved: 2026-10-28
        domain: fibf-cyb-cvd
        snapshot: context
        checked: >-
          Domain page; links 1 workbook(s) in the snapshot scope (below). No copyright or licence notice in the page.
      - id: fibf-page-cyb-soc
