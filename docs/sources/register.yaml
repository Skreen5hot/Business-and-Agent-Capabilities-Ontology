  access_terms: Openly published; no licence statement found
  definition: 'Glossary p.154: Capability is the {Q1}, outcome or course of action.
    A Capability Configuration combines physical resources (people, technology)
    and implements processes to realize a capability. The C1 view builds specialization
    and aggregation taxonomies independent of implementation'
  quotes:
