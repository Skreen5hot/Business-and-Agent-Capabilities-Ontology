    url: https://www.vanharen.net/store/archimater-4-specification
  - label: Visual Paradigm summary
    url: https://guides.visual-paradigm.com/2026/02/
  access_terms: Registration. Member licence; free 90-day evaluation, then free
    non-commercial or paid commercial licence; no redistribution terms stated
  definition: Strategy text not read. Vendors report the concept count cut from
    about 60 to 42, with layers renamed domains and behaviour merged. Capability
    and Resource are not reported as removed
  claims:
  - status: S
  - status: L
