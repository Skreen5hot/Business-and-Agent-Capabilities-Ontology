# The citation register for the Business Capability Ontology, as data.
#
# The source of truth for every register entry (ADR-003 D6, proposed).
# docs/sources/business-capability-definition-sources.md is generated from
# this file and from register-companion.md by
# tools/sources/build_register.py; edit here, then run it with --write.
#
# Each entry:
#   id            SRC-<family>-<nn>; the family must be listed in a section
#   authority     A1 to A9, the scale explained in the companion
#   citation      publisher, title, version, date (the Source column)
#   urls          [{label, url, prefix?, suffix?}]; empty renders "none retrieved"
#   access_terms  licence and access terms
#   definition    the definition, paraphrased
#   quotes        [{key: SRC-<family>-<nn>-Q<n>, text}]; at most one per
#                 entry, at most 15 words, placed in prose as {Q<n>}
#   claims        [{status, scope?, note?}]; status is exactly one of
#                 V, P, S, K, L. scope says what part of the source the
#                 status covers; note carries any other qualifier
#
# Quotation marks are never typed into prose. A verbatim quotation is a
# quote, placed with {Q1}. A title or a term's name that needs quotation
# marks is a declared mention, {mention:...}. Neither may contain '|'.

