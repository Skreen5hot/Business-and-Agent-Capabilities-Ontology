    text: expected ability of one or more resources to deliver a specified type
      of effect
  claims:
  - status: V
- id: SRC-GOV-05
  authority: A3
  citation: US GSA Office of Shared Solutions and Performance Improvement, *Federal
    Integrated Business Framework (FIBF)*, the per-domain business standards of each
    standards lead agency, as published at ussm.gsa.gov on 2026-10-28 (39 workbooks
    and one page, each pinned by SHA-256 in the inventory's rights review, source
    fibf-2026-10-28). FFM business capabilities were formerly published as FFMSRs
    (FMCF-3, FY 2024)
  urls:
  - label: GSA FIBF
    url: https://ussm.gsa.gov/fibf/
    suffix: (SHA-256 `9d32b82c297961d248592a13818069ddf857b05926caf3e1331cc00266e8f49a`,
      retrieved 2026-10-28)
  - label: FMCF-3 FY2024
    url: https://ussm.gsa.gov/assets/files/downloads/fm/FMCF-3%20FFM%20Business%20Capabilities%20(FFMSRs)_FY%202024%20Release.pdf
    prefix: 'Historical:'
    suffix: (returned HTTP 404 on 2026-10-28; the financial management page now publishes
      2025 workbooks instead)
  access_terms: 'Mixed, and not uniformly public domain. Unmarked FIBF documents are
    US Government works, free of copyright under 17 U.S.C. 105; GSA''s reuse policy
    tells readers to check each item for a copyright credit. 21 of the 39 pinned workbooks
    carry a MITRE Corporation copyright line with unlimited usage rights for the Federal
    Government: the public''s right to redistribute them is not established, and the
    inventory does not harvest them. The 11 HR business-capability lists carry no notice
    but link to files on a MITRE host; their text is withheld pending provenance evidence.
    The IT and cybersecurity operational workbooks map entries to third-party frameworks,
    whose mapping text is excluded. Evidence: docs/sources/inventory/rights.yaml'
  definition: Business capabilities are outcome-based needs linked to authoritative
    references, inputs, outputs and data standards; that is, requirement records.
    Lifecycles are {Q1}
  quotes:
  - key: SRC-GOV-05-Q1
    text: comprised of functions and activities
  claims:
