entries:
- id: SRC-ISO-01
  authority: A1
  citation: 'ISO/IEC 21838-2:2021, *Top-level ontologies — Part 2: Basic Formal
    Ontology*. ISO/IEC JTC 1. OWL artefact: BFO-2020 `bfo-core.ttl` at commit 044490fc'
  urls:
  - label: IEC webstore
    url: https://webstore.iec.ch/publication/72703
  - label: ISO 74572
    url: https://www.iso.org/standard/74572.html
  - label: bfo-core.ttl
    url: https://raw.githubusercontent.com/BFO-ontology/BFO-2020/044490fc5100ffed6df7d4d15cbc167698b6fdee/src/owl/bfo-core.ttl
  access_terms: ISO text paid, all rights reserved. OWL files CC BY 4.0
  definition: Has no capability class. Disposition (BFO_0000016) is a realizable
    entity grounded in the bearer's physical make-up; its loss physically changes
    the bearer. Role (BFO_0000023) is externally grounded, and losing it leaves
    the bearer physically unchanged. `has material basis` (BFO_0000218) has domain
    disposition, and its object must be a material continuant part of the bearer
  claims:
  - status: V
    scope: OWL
    note: ISO text not compared word for word; ISO catalogue returned 403
- id: SRC-ISO-02
  authority: A1
  citation: ISO 19440:2020, *Enterprise modelling and architecture — Constructs
    for enterprise modelling*, ed. 2, 2020-05. ISO/TC 184/SC 5. Replaces ISO 19440:2007
  urls:
  - label: ISO 74491
    url: https://www.iso.org/standard/74491.html
  - label: iTeh preview
    url: https://cdn.standards.iteh.ai/samples/74491/2045fbd5664f4ea387f29eaa07fd903e/ISO-19440-2020.pdf
  access_terms: Paid, all rights reserved
  definition: 'Two senses. 3.5, general: {Q1}. 3.6, the Capability construct: a
    collection of capability attributes of a Resource (the capability it provides)
    or of an Enterprise Activity (the capability it requires). Construct names are
    capitalized to keep the construct apart from the ordinary word. The 2020 edition
    replaced Functional Entity with {mention:active Resource}'
  quotes:
  - key: SRC-ISO-02-Q1
    text: ability to perform a specified activity
  claims:
  - status: P
    scope: clause 3 to 3.51 only
  - status: L
    scope: clause 7.14
- id: SRC-ISO-03
  authority: A1
  citation: ISO 19439:2006, *Enterprise integration — Framework for enterprise modelling*,
    ed. 1; confirmed 2015
  urls:
  - label: ISO 33833
    url: https://www.iso.org/standard/33833.html
  access_terms: Paid
  definition: Used {mention:capabilities} in its design-specification-phase definition
    (3.13). ISO 19440:2020 3.23 replaced the word with {mention:Enterprise Activities}
  claims:
  - status: P
    scope: via the 19440 source note
    note: status after 2015 unverified
- id: SRC-ISO-04
  authority: A1
  citation: ISO 15704:2019, *Requirements for enterprise-referencing architectures
    and methodologies*, ed. 2, 2019-12
  urls:
  - label: ISO 71890
    url: https://www.iso.org/standard/71890.html
  access_terms: Paid
  definition: Reference base of concepts for enterprise architectures; does not
    define standard enterprises or processes. Whether it defines capability is unknown
  claims:
  - status: P
    scope: catalogue only
  - status: L
- id: SRC-ISO-05
  authority: A1
  citation: ISO 9000:2015, *Quality management systems — Fundamentals and vocabulary*,
    3.6.12
  urls:
  - label: ISO 45481
    url: https://www.iso.org/standard/45481.html
    suffix: (number unverified)
  - label: ERA terminology reproduction
    url: https://www.era.europa.eu/era-railway-terminology-collection/capability/term_1/sms_safety_culture_human_and_organisational_factor
  access_terms: Paid
  definition: The ability of any object to realize an output that meets the requirements
    for that output. Note 1 points statistical process capability to ISO 3534-2
  claims:
  - status: S
    scope: via the ERA collection
- id: SRC-ISO-06
  authority: A1
  citation: ISO/IEC 33020:2019, *Process measurement framework for assessment of
    process capability*, ed. 2; confirmed 2026
  urls:
  - label: ISO 78526
    url: https://www.iso.org/standard/78526.html
  access_terms: Paid
  definition: 'Process capability is a quality characteristic of a process: its
    ability to meet current or projected business goals consistently. Attribute
    ratings form a process profile, from which a capability level is derived'
  claims:
  - status: P
    scope: catalogue abstract
- id: SRC-ISO-07
  authority: A1
  citation: ISO/IEC 33001:2015, *Process assessment — Concepts and terminology*
  urls: []
  access_terms: Paid
  definition: Terminology for process capability, capability level and process attribute.
    Not read
  claims:
  - status: K
  - status: L
- id: SRC-ISO-08
  authority: A1
  citation: ISO/IEC/IEEE 42010:2022, *Architecture description*, ed. 2, Nov 2022
  urls:
  - label: ISO 74393
    url: https://committee.iso.org/standard/74393.html
  - label: NORA wiki
    url: https://noraonline.nl/wiki/ISO_42010
  access_terms: Paid
  definition: No evidence that it defines capability. Its terms centre on entity
    of interest, stakeholder, concern, viewpoint and view
  claims:
  - status: S
    note: absence unverified
- id: SRC-OMG-01
  authority: A2
  citation: 'OMG, *Value Delivery Modeling Language (VDML)* 1.1, formal/18-09-03.
    PDF says Oct 2018; spec page says Mar 2018. IPR: Non-Assert'
  urls:
  - label: OMG VDML
    url: https://www.omg.org/spec/VDML/
  - label: PDF
    url: https://www.omg.org/spec/VDML/1.1/PDF
  access_terms: Free download under the OMG licence. Informational copies only;
    no network posting or resale; whole-document redistribution not permitted
  definition: '§7.2.5.3.1: a Capability is {Q1}. §7.2.2.3.3: a CapabilityOffer is
    that ability gained by applying resources managed together, with exactly one
    OrgUnit provider. CapabilityMethods (activity networks) deliver it. The methodOwner
    OrgUnit, which has authority over the method''s design, is kept apart from provider
    OrgUnits (§7.1.8). An Activity names the capability it requires (§7.1.9)'
  quotes:
  - key: SRC-OMG-01-Q1
    text: the ability to perform a particular kind of work and deliver desired value
  claims:
  - status: V
- id: SRC-OMG-02
  authority: A2
  citation: OMG, *Business Motivation Model (BMM)* 1.3, formal/15-05-19, May 2015
  urls:
  - label: OMG BMM
    url: https://www.omg.org/spec/BMM/
  - label: PDF
    url: https://www.omg.org/spec/BMM/1.3/PDF
  access_terms: OMG licence (as for VDML)
  definition: No capability concept. Capability is one item in the list defining
    Means (§8.3). A Means names {Q1}, not process steps or responsibility. Business
    Processes realize Courses of Action, not capabilities (§8.3.3)
  quotes:
  - key: SRC-OMG-02-Q1
    text: the capabilities that can be exploited to achieve the desired Ends
  claims:
  - status: V
- id: SRC-OMG-03
  authority: A2
  citation: OMG, *Business Architecture Core Metamodel (BACM)* 1.1, formal/26-09-01,
    Sep 2026. 1.0 formal Aug 2024; 1.2 Beta 1 Sep 2026 (dtc/26-03-26). Developed
    with the Business Architecture Guild
  urls:
  - label: OMG BACM
    url: https://www.omg.org/spec/BACM
  - label: 1.1 PDF
    url: https://www.omg.org/spec/BACM/1.1/PDF
  - label: 1.2 Beta1
    url: https://www.omg.org/spec/BACM/1.2/Beta1/PDF
  access_terms: OMG licence; non-assert IPR
  definition: '§7.3.2.7: Capability generalizes over the variant behaviours that
    produce the same Outcome, and is {Q1} without saying how. CapabilityBehavior
    (process diagrams, procedures, rules) delivers it (§7.3.2.8). CapabilityImplementation
    groups the Roles, Performers and resources (§7.3.2.9). Assigning a PerformerRole
    confers authority and responsibility (§7.3.2.16). Capabilities decompose in
    a strict hierarchy but may not be specialized (§7.3.2.7). OrgUnit includes individuals
    (§7.3.4.5)'
  quotes:
  - key: SRC-OMG-03-Q1
    text: the ability a business has to produce an Outcome
  claims:
  - status: V
    scope: '1.1'
    note: 1.2 changes and Annex A not read
- id: SRC-OMG-04
  authority: A2
  citation: OMG, *Unified Architecture Framework (UAF) Domain Metamodel* 1.3, formal/25-10-01.
    PDF dated Sep 2025; spec page gives Apr 2026
  urls:
  - label: OMG UAF
    url: https://www.omg.org/spec/UAF/
  - label: DMM PDF
    url: https://www.omg.org/spec/UAF/1.3/DMM/PDF
  access_terms: OMG licence
  definition: 'Strategic::Taxonomy::Capability: {Q1}, realized through ways and
    means such as CapabilityConfigurations. Modelled as a PropertySet. Any CapableElement
    (operational agent, service, actual resource, actual organization) can exhibit
    a capability under given conditions. Activities map to the capabilities they
    help provide. Personnel Competence is a separate concept'
  quotes:
  - key: SRC-OMG-04-Q1
    text: An enterprise's ability to Achieve a desired effect
  claims:
  - status: V
    note: generalization chain partly traced
- id: SRC-OG-01
  authority: A2
  citation: The Open Group, *TOGAF Standard, 10th Edition*, C220, Apr 2022; definitions
    in {mention:Introduction and Core Concepts}
  urls:
  - label: Van Haren sample (front matter, references)
    url: https://download.boekhuis.nl/9789401809054_fragm-docb.pdf
  - label: Unicom TOGAF help
    url: https://support.unicomsi.com/manuals/systemarchitect/114100/Architecting_and_designing/TOGAF1495890.html
  access_terms: Online reading now behind Open Group SSO; book editions single-user
    licence; treat as not redistributable
  definition: 'Business Capability (added in TOGAF 9.2, per a vendor): an ability
    a business possesses or exchanges to achieve a purpose. The older generic Capability
    is reported, from memory only, to admit an organization, person or system as
    possessor. Capability-based planning {mention:Capability} is an outcome delivered
    by work packages, built in increments'
  claims:
  - status: S
  - status: K
  - status: L
- id: SRC-OG-02
  authority: A2
  citation: 'The Open Group, *TOGAF Series Guide: Business Capabilities, Version
    2*, G211, 25 Apr 2022; supersedes G189 (Jun 2018). Companions: Value Streams
    G178, Business Models G18A, Organization Mapping; Capability-Based Planning
    G193 (Jul 2019)'
  urls:
  - label: Catalogue G211
    url: https://publications.opengroup.org/g211
  - label: Van Haren sample ToC
    url: https://download.boekhuis.nl/9789401809054_fragm-docb.pdf
  - label: Van Haren 2025 update
    url: https://www.vanharen.net/store/the-togafr-standard-10th-edition-business-architecture-2025-update
  access_terms: HTML readable online after login; download needs login
  definition: 'The table of contents lists people, processes, information and resources
    as elements that *implement* a capability. Capability maps are cross-mapped
    to organization, value streams and processes, and heat-mapped. The Organization
    Mapping guide says business units or third parties possess or use capabilities.
    Short quote (front matter): {Q1}. The text of §10.1 was not read'
  quotes:
  - key: SRC-OG-02-Q1
    text: possess or use those capabilities
  claims:
  - status: P
    scope: ToC, front matter
  - status: L
- id: SRC-OG-03
  authority: A2
  citation: 'The Open Group, *ArchiMate 3.2 Specification*. Date conflict: 2022
    in one note, 2023 in another (see the discrepancy table). Document number believed
    to be C226, unverified. 3.1 is C197, Nov 2019'
  urls:
  - label: 'Community issue #13'
    url: https://community.opengroup.org/archimate-community/workgroups/archimate-feedback/-/issues/13
  - label: Calhau et al. 2024 §2
    url: https://conferences.big.tuwien.ac.at/biweek2024/pdfs/biweek2024_paper_150.pdf
  access_terms: Open Group copyright; registration
  definition: 'A strategy-layer behaviour element: {Q1}, with organization, person
    or system as examples. Core behaviour elements (business, application, technology)
    realize it. Capabilities can serve other capabilities; resources are assigned
    to them'
  quotes:
  - key: SRC-OG-03-Q1
    text: an ability that an active structure element … possesses
  claims:
  - status: S
  - status: L
- id: SRC-OG-04
  authority: A2
  citation: 'The Open Group, *ArchiMate 4 Specification*, released Apr 2026 (listings:
    24 Apr 2026); document number not found. Snapshot 1: S250, mid-2025'
  urls:
  - label: Licensed downloads
