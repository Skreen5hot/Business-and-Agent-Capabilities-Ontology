# Catalog concept records (bcoc:). Edited by hand; built by
# tools/vocab/build.py into src/01_controlled_vocabulary/generated/bco-catalog.ttl.
#
# P5 holds the 5 pilot capabilities the specification's worked examples
# and migration table name, all Draft. Their definitions were revised on
# 2026-10-24 in answer to review R6, section 3 (reviews/R6-disposition.md).
#
#   - id: bcoc:TreasuryManagement
#     pref_label:                       # one per language; English required
#       - {value: Treasury Management, language: en}
#     definition: >-                    # English, genus-differentia:
#       A ... that ...                  #   "A <genus> that <differentia>"
#     genus: bco:BusinessCapability     # the immediate genus: a vendored BFO/CCO
#                                       #   class, or a metamodel concept's
#                                       #   designated class
#     foundational_ancestor: cco:ont00000568   # a vendored BFO/CCO class above it
#     broader: [bcoc:FinancialManagement]   # broader only; narrower is refused
#     notation: "10759"                 # PCF 7.4 element ID, quoted (bco:PCFCode)
#     designates_class: bco:TreasuryManagementCapability   # optional
#     sources: [...]                    # as in metamodel.yaml, support included
#     drafted_by: bcoa:claude-opus-5-5
#     created: "2026-11-01T00:00:00Z"
#     authored_status: Draft
#     change_note: [...]                # optional; why the record changed
#
# The definition must share no 6-word run with any quote in the register
# (D6's tripwire). Never authored: lifecycle_status, owl:deprecated,
# narrower.
#
# How the records are written:
#   - Each definition takes Business Capability, as specification section 4
#     defines it, as its genus in prose, and `genus` records that immediate
#     genus: bco:BusinessCapability, the class bcom:BusinessCapability
#     designates. `foundational_ancestor` records cco:ont00000568
#     (Organization Capability), section 4's CCO parent of Business
#     Capability. Both are annotations; bco:BusinessCapability stays
#     unminted, and no subclass axiom is asserted (review R7 Finding E,
#     docs/decisions/2026-10-25-r7-genus-decision.md). Until R7 the field
#     named cco:ont00000568 itself, because it had to be a vendored class.
#   - Since R6, the differentia says what the capability is for, not a list
#     of the practices through which an organization typically exercises
#     it. An enumerated list reads as a set of necessary conditions, and
#     would exclude an organization that has the capability but not one of
#     the listed practices (R6 section 3). The realization index, which
#     names the admissible act types, lives in the class's
#     ex:enablesProcess annotations (CD4), not in this text.
#   - "realizable in", not "realized in": a capability need never have been
#     exercised (CD8).
#   - Every source here is consistent-with, and every one is contextual: it
#     backs the general view that a capability is an organization's
#     ability, distinct from the processes that exercise it, and none
#     states anything specific to one of these five definitions (R6
#     section 6.1).
#   - No notation: no PCF 7.4 catalog node at BPO commit
#     66131945b525c54f44e4962f32bb1f52dfa0cd12 designates any of these
#     capability classes (ADR-001 R4). Every candidate node designates a
#     process class instead.
#   - No broader: CD9 admits a link between capability classes only after
#     review, and neither the specification nor BPO establishes one here.
#   - No designates_class: no capability class has passed G1-T (CD3).

version: 1
concepts:
  - id: bcoc:StrategicPlanning
    pref_label:
      - {value: Strategic Planning, language: en}
    definition: >-
      A business capability, inhering in an organization, that is
      realizable in planned acts by which that organization sets or revises
      its aims and the courses of action it means to take toward them.
    genus: bco:BusinessCapability
    foundational_ancestor: cco:ont00000568
    sources:
      - source: SRC-OMG-03
        locator: >-
          BACM 1.1, section 7.3.2.7 (Capability is identified by the Outcome a
          business can produce, not by how it is produced)
        relation: consistent-with
        support: contextual
      - source: SRC-FO-01
        locator: >-
          CCO v2.0 merged file at commit 510dad7 and develop versionIRI
          2026-08-13: Organization Capability (ont00000568) definition
        relation: consistent-with
        support: contextual
      - source: SRC-OMG-02
        locator: >-
          BMM 1.3, section 8.3.3 (Strategies and Tactics are the categories of
          Course of Action, and Business Processes realize Courses of Action)
        relation: consistent-with
        support: contextual
      - source: SRC-IND-02
        locator: >-
          APQC article summary (capabilities are what is needed to do the
          work, processes are the work); the full text is members-only and
          was not read
        relation: consistent-with
        support: contextual
    drafted_by: bcoa:claude-opus-5-5
    created: "2026-10-24T12:14:15Z"
    authored_status: Draft
    revises: 9c3c13a1645216148bb897e961e8cf19779331e8f7bcfa55b10c26967668e45d
    change_note:
      - >-
        2026-10-24, review R6 section 3.4: generalized. The definition named
        a mission statement, a long-term strategic vision, and
        enterprise-wide and business-unit strategies. An organization with
        no business units or no written mission can still plan
        strategically, so the list made customary practices necessary
        conditions. It now says what the capability is for. "Realized in"
        became "realizable in" (CD8). Every source is now marked contextual
        (R6 section 6.1).
      - >-
        2026-10-25, review R7 section 4: "long-range" dropped. Planning over a
        short horizon, or revising aims in response to an event, can be
        strategic, and the qualifier excluded it. The genus field now names
        the immediate genus, bco:BusinessCapability: the class the
        definition's text names and bcom:BusinessCapability designates.
        cco:ont00000568 (Organization Capability) moved to
        foundational_ancestor (review R7 Finding E;
        docs/decisions/2026-10-25-r7-genus-decision.md). Nothing is minted.

  - id: bcoc:TreasuryManagement
    pref_label:
      - {value: Treasury Management, language: en}
    definition: >-
      A business capability, inhering in an organization, that is
      realizable in planned acts by which that organization manages its
      cash positions, liquidity, funding and financial exposures toward
      meeting its financial obligations.
    genus: bco:BusinessCapability
    foundational_ancestor: cco:ont00000568
    sources:
      - source: SRC-OMG-03
        locator: >-
          BACM 1.1, section 7.3.2.7 (Capability is identified by the Outcome a
          business can produce, not by how it is produced)
        relation: consistent-with
        support: contextual
      - source: SRC-FO-01
        locator: >-
          CCO v2.0 merged file at commit 510dad7 and develop versionIRI
          2026-08-13: Organization Capability (ont00000568) definition
        relation: consistent-with
        support: contextual
      - source: SRC-IND-02
        locator: >-
          APQC article summary (capabilities are what is needed to do the
          work, processes are the work); the full text is members-only and
          was not read
        relation: consistent-with
        support: contextual
    drafted_by: bcoa:claude-opus-5-5
    created: "2026-10-24T12:14:15Z"
    authored_status: Draft
    revises: 4032a5e7c5ec955323f98b47908641331e3fa6db6ad7bc3776248cf56db47927
    change_note:
      - >-
        2026-10-24, review R6 section 3.5: generalized. The definition
        required treasury oversight, cash tracking and reconciliation, an
        investment policy and a hedging strategy, all four. A small business
        that manages its liquidity without hedging would have been excluded.
        It now says what the capability is for: having the means to pay when
        payment falls due. "Realized in" became "realizable in" (CD8). Every
        source is now marked contextual (R6 section 6.1).
      - >-
        2026-10-25, review R7 section 4: "ensures" removed. It made a
        successful outcome, always having the cash to pay, a condition of
        having the capability, so an organization that manages its liquidity
        and still meets a funding shortfall would not have it. The capability
        is an ability to undertake the management; the definition now says
        what that management is directed toward. The wording follows the
        reviewer's suggested refinement in substance. The genus field now
        names the immediate genus, bco:BusinessCapability: the class the
        definition's text names and bcom:BusinessCapability designates.
        cco:ont00000568 (Organization Capability) moved to
        foundational_ancestor (review R7 Finding E;
        docs/decisions/2026-10-25-r7-genus-decision.md). Nothing is minted.

  - id: bcoc:CompetitiveAnalysis
    pref_label:
      - {value: Competitive Analysis, language: en}
    definition: >-
      A business capability, inhering in an organization, that is
      realizable in planned acts by which that organization gathers and
      interprets information about the agents it competes with, or may come
      to compete with, to inform its own decisions.
    genus: bco:BusinessCapability
    foundational_ancestor: cco:ont00000568
    sources:
      - source: SRC-OMG-03
        locator: >-
          BACM 1.1, section 7.3.2.7 (Capability is identified by the Outcome a
          business can produce, not by how it is produced)
        relation: consistent-with
        support: contextual
      - source: SRC-FO-01
        locator: >-
          CCO v2.0 merged file at commit 510dad7 and develop versionIRI
          2026-08-13: Organization Capability (ont00000568) definition, and
          Skill (ont00000089) as the person-borne sibling under Agent
          Capability
        relation: consistent-with
        support: contextual
      - source: SRC-IND-02
        locator: >-
          APQC article summary (capabilities are what is needed to do the
          work, processes are the work); the full text is members-only and
          was not read
        relation: consistent-with
        support: contextual
    drafted_by: bcoa:claude-opus-5-5
    created: "2026-10-24T12:14:15Z"
    authored_status: Draft
    revises: 4f9e151dad91e19385f2bcbe430606e63e576f0464e598107905ad369fc6e020
    change_note:
      - >-
        2026-10-24, review R6 section 3.2: generalized, and a clause dropped.
        The definition required the analysis to be carried out through
        coordinated work among the organization's members, not resting on
        one analyst's skill. That made the number of members doing the work
        part of what the capability is, which specification CD2's
        "Fragility is not reclassification" bullet denies: a capability may
        depend on one indispensable member and still be the organization's.
        Whether capabilities of this type are organizational rather than a
        person's Skill is asked once, at type admission (G1-T question 3),
        not stated as a condition on every instance. "Realized in" became
        "realizable in" (CD8). Every source is now marked contextual (R6
        section 6.1).
      - >-
        2026-10-25, review R7 section 4: "organizations" became "agents". A
        competitor need not be an organization: a sole trader is a person. The
        bearer of the capability is still an organization; only what it
        analyses is widened. The genus field now names the immediate genus,
        bco:BusinessCapability: the class the definition's text names and
        bcom:BusinessCapability designates. cco:ont00000568 (Organization
        Capability) moved to foundational_ancestor (review R7 Finding E;
        docs/decisions/2026-10-25-r7-genus-decision.md). Nothing is minted.

  - id: bcoc:BusinessModelGovernance
    pref_label:
      - {value: Business Model Governance, language: en}
    definition: >-
      A business capability, inhering in an organization, that is
      realizable in planned acts by which that organization judges whether
      the business models it operates by still serve it, and decides
      whether and how they should change.
    genus: bco:BusinessCapability
    foundational_ancestor: cco:ont00000568
    sources:
      - source: SRC-OMG-03
        locator: >-
          BACM 1.1, section 7.3.2.7 (Capability is identified by the Outcome a
          business can produce, not by how it is produced)
        relation: consistent-with
        support: contextual
      - source: SRC-FO-01
        locator: >-
          CCO v2.0 merged file at commit 510dad7 and develop versionIRI
          2026-08-13: Organization Capability (ont00000568) definition
        relation: consistent-with
        support: contextual
      - source: SRC-IND-02
        locator: >-
          APQC article summary (capabilities are what is needed to do the
          work, processes are the work); the full text is members-only and
          was not read
        relation: consistent-with
        support: contextual
    drafted_by: bcoa:claude-opus-5-5
    created: "2026-10-24T12:14:15Z"
    authored_status: Draft
    revises: f32f3c25461cb2b3adf8eb70dcc8bd02a746e2eed40c9d53a14866e9bab9897d
    change_note:
      - >-
        2026-10-24, review R6 section 3.1: generalized, and the development
        clause removed. The definition said that acts first establishing
        this oversight develop the capability and are not, on that ground
        alone, realizations of it. That is specification CD5's distinction
        between developing and realizing a capability, and it is stated
        there for every capability; restating it in one definition made it
        read as a condition peculiar to this one. The definition now says
        what the capability is for. "Realized in" became "realizable in"
        (CD8). Every source is now marked contextual (R6 section 6.1).
      - >-
        2026-10-25, review R7 section 4: "decides how they should change"
        became "decides whether and how they should change", so that deciding
        to change nothing is a realization of the capability too. The genus
        field now names the immediate genus, bco:BusinessCapability: the class
        the definition's text names and bcom:BusinessCapability designates.
        cco:ont00000568 (Organization Capability) moved to
        foundational_ancestor (review R7 Finding E;
        docs/decisions/2026-10-25-r7-genus-decision.md). Nothing is minted.

  - id: bcoc:CustomerExperienceManagement
    pref_label:
      - {value: Customer Experience Management, language: en}
    definition: >-
      A business capability, inhering in an organization, that is
      realizable in planned acts by which that organization understands or
      shapes the experience its customers have in their dealings with it.
    genus: bco:BusinessCapability
    foundational_ancestor: cco:ont00000568
    sources:
      - source: SRC-OMG-03
        locator: >-
          BACM 1.1, section 7.3.2.7 (Capability is identified by the Outcome a
          business can produce, not by how it is produced)
        relation: consistent-with
        support: contextual
      - source: SRC-FO-01
        locator: >-
          CCO v2.0 merged file at commit 510dad7 and develop versionIRI
          2026-08-13: Organization Capability (ont00000568) definition
        relation: consistent-with
        support: contextual
      - source: SRC-IND-02
        locator: >-
          APQC article summary (capabilities are what is needed to do the
          work, processes are the work); the full text is members-only and
          was not read
        relation: consistent-with
        support: contextual
    drafted_by: bcoa:claude-opus-5-5
    created: "2026-10-24T12:14:15Z"
    authored_status: Draft
    revises: 22e11eb83461eb43ba3573ab14c1528dbfb0cd0f74f6cbd441ca275c4e310072
    change_note:
      - >-
        2026-10-24, review R6 section 3.3: generalized. The definition
        required the organization to appraise its customers' experience, set
        a strategy for it, and design customer interactions and their
        supporting structures, all three. An organization that manages its
        customers' experience well without a separately stated strategy
        would have been excluded. It now says what the capability is for.
        "Realized in" became "realizable in" (CD8). Every source is now
        marked contextual (R6 section 6.1).
      - >-
        2026-10-25, review R7 section 4: "comes to understand, and acts to
        shape" became "understands or shapes". The definition names the kinds
        of planned act the capability is realizable in, and an act of either
        kind realizes it. Reading the conjunction as requiring both repeated
        the problem R6 section 3 removed: listed practices read as conditions
        that must all hold, which would deny the capability to an organization
        able to do only one of the two. The cost, stated: an organization that
        only studies its customers' experience now has the capability. That is
        the reading chosen; the architect may reverse it. The genus field now
        names the immediate genus, bco:BusinessCapability: the class the
        definition's text names and bcom:BusinessCapability designates.
        cco:ont00000568 (Organization Capability) moved to
        foundational_ancestor (review R7 Finding E;
        docs/decisions/2026-10-25-r7-genus-decision.md). Nothing is minted.
