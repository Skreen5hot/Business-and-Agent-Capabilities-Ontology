  - id: bcom:CapabilityMaturityRating
    spec_row: ex:CapabilityMaturityRating
    sources:
      - source: SRC-OMG-01
        locator: >-
          VDML 1.1, section 7.2.2.3.3 (heatIndex, a MeasuredCharacteristic of
          a CapabilityOffer)
        relation: consistent-with
        support: contextual
      - source: SRC-BA-08
        locator: >-
          Offerman et al. 2017, p. 384 (the level sense of capability, kept
          apart from its availability)
        relation: consistent-with
        support: contextual
      - source: SRC-ISO-06
        locator: ISO catalogue page 78526, abstract of ISO/IEC 33020:2019
        relation: departs-from
        claim: 1
        departure_note: >-
          Homonym. ISO/IEC 33020 process capability is a quality
          characteristic of a process, and its capability level is derived
          from process attribute ratings. A Capability Maturity Rating ranks
          an existing Organization Capability instance, never a process, and
          is not a process capability level (register SF-10).
      - source: SRC-IND-07
        locator: CMMI Institute web page on capability and maturity levels
        relation: departs-from
        claim: 1
        departure_note: >-
          Homonym. CMMI capability levels rate performance in one practice
          area, and maturity levels describe the organization across a set
          of practice areas; both rate how work is performed. A Capability
          Maturity Rating ranks an Organization Capability instance on a
          stated scale and prescribes no scale or scoring method.
      - source: SRC-FO-08
        locator: >-
          Calhau et al. 2024, description of the UFO capability ontology
          (capability level as a quality of the capability); the
          formal-ontology note records no section number
        relation: departs-from
        claim: 1
        departure_note: >-
          The UFO line puts maturity inside the capability, as a quality (the
          capability level) inhering in it. In BFO a specifically dependent
          continuant inheres only in an independent continuant, so the BCO
          makes the rating an Ordinal Measurement ICE about the capability
          instance instead (register SF-12).
    drafted_by: bcoa:claude-opus-5-5
