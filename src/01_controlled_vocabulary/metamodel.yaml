        definition says) or contextual (it backs only the general view the
        scheme rests on). No definition, locator or relation changed; the
        definition is still specification section 4's.

  - id: bcom:CapabilityMap
    spec_row: ex:CapabilityMap
    sources:
      - source: SRC-IND-08
        locator: >-
          Gartner IT Glossary, entry for business capability modeling (the
          model is a representation)
        relation: consistent-with
        support: contextual
      - source: SRC-BA-04
        locator: >-
          Cutter executive summary of the report (the map as a model and
          shared vocabulary; the full report was not read)
        relation: consistent-with
        support: contextual
      - source: SRC-OMG-01
        locator: >-
          VDML 1.1, section 7.2.5.3.1 (CapabilityLibrary) and section
          7.2.5.3.2 (CapabilityDefinition as a standardized definition)
        relation: consistent-with
        support: contextual
      - source: SRC-GOV-04
        locator: >-
          NAF v4.1 ArchiMate Implementation Guide, section 5, C1 Capability
          Taxonomy, p.17
        relation: departs-from
        claim: 1
        departure_note: >-
          NAF's C1 view organizes capabilities into specialization and
          aggregation taxonomies, independent of implementation. A BCO
          Capability Map is not a taxonomy of capability types: it describes
          one organization, its entries are Capability Assessments and
          Capability Targets, and the arrangement of entries asserts no
          parthood or specialization among capabilities (CD14, CD17). What a
          capability type means is stated once, in its class definition and
          catalog concept.
    drafted_by: bcoa:claude-opus-5-5
