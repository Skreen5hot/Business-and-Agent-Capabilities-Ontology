  - id: bcom:CapabilityTarget
    spec_row: ex:CapabilityTarget
    sources:
      - source: SRC-GOV-04
        locator: >-
          NAF v4.1 ArchiMate Implementation Guide, section 6, C2 Enterprise
          Vision, p.20 (the phases capabilities aim at) and section 11, C8
          Planning Constraints, p.32 (Capability Milestones)
        relation: consistent-with
        support: contextual
      - source: SRC-FO-12
        locator: >-
          CaaS project, Definitions of concepts web page (Capability is
          required by a Goal and serves to formulate requirements)
        relation: departs-from
        claim: 1
        departure_note: >-
          In CDD the Capability doubles as the requirement for an ability to
          meet a goal. The BCO keeps the two apart: the requirement is a
          Capability Target, an Objective that prescribes that an
          organization come to bear a capability of a given type, and the
          capability itself is a disposition the target does not imply
          exists.
    drafted_by: bcoa:claude-opus-5-5
