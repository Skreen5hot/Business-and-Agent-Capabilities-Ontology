# Metamodel concept records (bcom:), ADR-003 D4. Edited by hand; built by
# tools/vocab/build.py into src/01_controlled_vocabulary/generated/bco-metamodel.ttl.
#
# P5 holds one record for each of the 9 concrete rows of specification
# section 4, all Draft. Because the list is non-empty, every concrete row
# needs a record and every record must name a row (D4-row-uncovered,
# D4-no-row).
#
# One record per row:
#
#   - id: bcom:CapabilityMap            # bcom:<the row's ex: local name>
#     spec_row: ex:CapabilityMap        # the row, as section 4 writes it
#     sources:                          # at least one (D6)
#       - source: SRC-OMG-03            # an id in docs/sources/register.yaml
#         locator: BACM 1.1, clause 7.2 # required
#         relation: departs-from        # adapted-from | consistent-with | departs-from
#         support: contextual           # consistent-with only, required there:
#                                       #   definitional | contextual (R6, 6.1)
#         departure_note: ...           # departs-from only, required there
#         claim: 1                      # departs-from only: the entry's claim, at V or P
#     drafted_by: bcoa:claude-opus-5-5  # a declared agent (src/01_controlled_vocabulary/agents.yaml)
#     created: "2026-11-01T00:00:00Z"   # quoted, UTC
#     authored_status: Draft            # Draft or Candidate, nothing else
#     # optional: ratified_by {path, commit, sha256}, is_replaced_by,
#     #           revises (the previous record digest), change_note [..]
#
# ratified_by cites a ratification act: a decision record holding one
# bco-ratification block (format in tools/vocab/citations.py), with
#
#   agent: <the person's full bcoa: IRI>
#   approvals:                          # R6 section 6.3; both required,
#     editorial: <a declared Person>    #   each a declared prov:Person
#     ontological: <a declared Person>
#   validation:
#     commit: <40 hex, reachable from main: where the gates ran>
#     gates: [<each gate command that passed there>]   # non-empty
#   concepts:
#     - iri: <the concept IRI, in full>
#       record_sha256: <build.py --digest of the record ratified>
#
# An act is the architect's. An agent records one verbatim; it never
# writes one.
#
# Never authored: definition (it is section 4's), prefLabel and
# designatesClass (derived from the row), lifecycle_status and
# owl:deprecated (derived, D5).
#
# Locators name only what the source notes in docs/sources/notes/ record
# for each source. Where a note records no clause or page for the point
# cited, the locator says so. Every departs-from cites a claim at V or P.
#
# support (review R6, section 6.1) says what a consistent-with source
# backs. definitional: it states something this definition says that is
# not shared by every concept in the scheme -- its genus as placed, or a
# differentia -- for a corresponding notion. contextual: it backs only a
# view the whole scheme rests on (capability as an ability distinct from
# process, a description distinct from what it describes, authority
# distinct from ability). The classification of 2026-10-24 found 5 of
# this file's 25 consistent-with references definitional.

version: 1
concepts:
  - id: bcom:BusinessCapability
    spec_row: ex:BusinessCapability
    sources:
      - source: SRC-FO-01
        locator: >-
          CCO v2.0 merged file at commit 510dad7 and develop versionIRI
          2026-08-13: Organization Capability (ont00000568), its definition,
          and its parent Agent Capability (ont00001379), which is placed under
          realizable entity (BFO_0000017)
        relation: adapted-from
      - source: SRC-FO-02
        locator: >-
          IOF Core release 202603, Core.rdf: Capability rdfs:subClassOf
          obo:BFO_0000016 (disposition)
        relation: consistent-with
        support: definitional
      - source: SRC-FO-03
        locator: >-
          arXiv:2405.00183v2, sections 4-5 (capability is a disposition,
          placed between disposition and function); sections 1 and 3
          (organizations and configured collectives as bearers)
        relation: consistent-with
        support: definitional
      - source: SRC-ISO-01
        locator: >-
          bfo-core.ttl at commit 044490fc: the elucidation of disposition
          (BFO_0000016) and the definition of has material basis
          (BFO_0000218)
        relation: consistent-with
        support: definitional
      - source: SRC-OMG-03
        locator: >-
          BACM 1.1, section 7.3.2.7 (Capability is identified by the Outcome a
          business can produce, not by how it is produced)
        relation: consistent-with
        support: contextual
      - source: SRC-FO-09
        locator: >-
          The Enterprise Ontology, AIAI author PDF, section 4.1 (AUTHORITY is
          held independently of CAPABILITY)
        relation: consistent-with
        support: contextual
      - source: SRC-OMG-04
        locator: >-
          UAF 1.3 DMM, Traceability package: CapableElement and the Exhibits
          relation (the omg-and-iso note records no page for these)
        relation: departs-from
        claim: 1
        departure_note: >-
          UAF lets any CapableElement (operational agent, service, actual
          resource or actual organization) exhibit a capability. A Business
          Capability inheres in an Organization and in nothing else (CD1);
          abilities of persons, systems and other resources are not Business
          Capabilities.
      - source: SRC-OMG-03
        locator: BACM 1.1, section 7.3.4.5 (OrgUnit)
        relation: departs-from
        claim: 1
        departure_note: >-
          BACM's OrgUnit, the performer through which capabilities are
          implemented, includes individuals. The BCO admits only an
          Organization as the bearer of a Business Capability (CD1); an
          individual's ability is CCO Skill or Agent Capability and is out of
          scope.
      - source: SRC-OMG-01
        locator: >-
          VDML 1.1, section 7.1.7 (Actors in OrgUnit Positions provide
          Capabilities) and section 7.1.9 (an Actor may fill the Role that
          provides a required Capability)
        relation: departs-from
        claim: 1
        departure_note: >-
          VDML lets individual Actors, human or machine, provide capabilities
          alongside OrgUnits. The BCO restricts the bearer to an Organization
          (CD1); an Actor's ability is classified as something else (a
          person's skill, or an artifact's function), not as a Business
          Capability.
      - source: SRC-GOV-04
        locator: NAF v4.1 ArchiMate Implementation Guide, glossary, PDF p.154 (Capability)
        relation: departs-from
        claim: 1
        departure_note: >-
          NAF defines a capability by what one or more resources can be
          expected to deliver, and its resources cover systems and equipment
          as well as organizations. The BCO narrows the bearer to an Organization (CD1);
          an organization-borne capability is a special case NAF permits, so
          the BCO narrows NAF rather than contradicting it.
      - source: SRC-GOV-04
        locator: >-
          NAF v4.1 ArchiMate Implementation Guide, glossary, PDF p.154
          (Capability Configuration)
        relation: departs-from
        claim: 1
        departure_note: >-
          NAF's Capability Configuration, the nearest analogue of a material
          basis, combines people and technology. The BCO's material basis is
          the organization's member agents only (CD2); systems, equipment and
          facilities are enabling conditions that take part in realizations,
          and losing one makes the capability unavailable, not absent.
      - source: SRC-FO-02
        locator: >-
          IOF Core release 202603, Core.rdf: capability of / has capability,
          whose bearer is any independent continuant (BFO_0000004)
        relation: departs-from
        claim: 1
        departure_note: >-
          IOF lets any independent continuant bear a capability, with
          artifacts (a lathe, a sensor) as its examples. The BCO adopts IOF's
          disposition placement but restricts the bearer of a Business
          Capability to an Organization (CD1); the register lists IOF among
          the bearer departures (SF-05).
      - source: SRC-ISO-02
        locator: >-
          ISO 19440:2020, entry 3.6 (Capability construct), read in the free
          preview of clause 3
        relation: departs-from
        claim: 1
        departure_note: >-
          ISO 19440 assigns a provided Capability to a Resource, which since
          the 2020 edition includes active Resources such as people, machines
          and IT. The BCO admits only an Organization as bearer (CD1).
    drafted_by: bcoa:claude-opus-5-5
    created: "2026-10-24T12:12:31Z"
    authored_status: Draft
    revises: 8dd8ce8adf61b6dc4ee2490b21f78ce57cb1a82b650a548cb64adde8a3e5e3a6
    change_note:
      - >-
        2026-10-24, review R6 section 6.1: each consistent-with source now
