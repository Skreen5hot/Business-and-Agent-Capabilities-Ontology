# The first Stage 05 formalization tranche: its tranche record (Stage 05
# standard, sections 2 and 5, S05-T1). Authored data, read by
# tools/ontology/formalize.py, which verifies every field below against the
# records it names and writes src/05_ontology/apqc-cap.ttl from it.
#
# Approved as D5-3 (docs/decisions/2026-11-15-bpo-inquiry-and-d5-approved.md);
# implementation authorized as D6, E (docs/decisions/2026-11-15-v05-transition-
# approved-d6-authorized.md). The parent and the 39 rows of the readiness
# package's section 2 marked "ready". Excluded, until their source checks
# (docs/catalog/tranche-2-followup.md, section 3): T2-02, T2-24, T2-31. Not
# here, as never admitted: the Q-12 blocked concepts and capability areas.
#
# Per class:
#   g1t                     the G1-T id
#   concept, class, label   as the readiness package's table gives them
#   signed_record           the signed G1-T record: its path, the commit
#                           whose bytes were signed, and (T2) its section.
#                           The SHA-256 the signature names is checked
#                           against those bytes, never against the working
#                           tree, whose status rows have moved on since
#   concept_record_sha256   the vocabulary concept's record digest
#                           (tools/vocab/build.py --digest), checked against
#                           the build, the signature record (T2) and the
#                           readiness package's prefix
#   index                   the realization index, member by member, in the
#                           signed order; each becomes one ex:enablesProcess
#   development_members     CAP-06 (S05-C4): every member under a CD5
#                           development genus, with its signed review reason.
#                           None in this tranche; the key is then omitted
#
# Edit only through change control (standard S9): a change to an index or a
# definition here is refused unless the signed record says the same.

