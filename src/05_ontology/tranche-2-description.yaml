# The Stage 05 description tranche: its tranche record (Stage 05 standard,
# sections 2 and 5, S05-T1). Authored data, read by
# tools/ontology/formalize.py, which verifies every field below against the
# records it names and writes src/05_ontology/apqc-cap-desc.ttl from it.
#
# Authorized, with its readiness record, by the architect's decision of
# 2026-11-15, B-1 (docs/decisions/2026-11-15-b1-b4-approved-cap34-confirmed.md):
# the seven description-layer classes of specification v0.5 section 4, the
# Authorization Record (CD15), bco:FunctionalAdequacyAssessment under
# cco:ont00000853 (CD17, as decided), and the annotation properties
# bco:concernsType and bco:assessedPresence. These are information-layer
# terms (K3), not capability types, so G1-T does not apply to them, and no
# class here is under cco:ont00000568.
#
# The readiness record is docs/proposals/2026-11-15-stage05-description-
# tranche-readiness.md.
#
# Per class:
#   class                   the IRI, in bco#. Its local name is the concept's
#                           (S1)
#   concept                 the metamodel concept (bcom:) whose label and
#                           definition the class carries; its record names the
#                           section 4 row, and the vocabulary's
#                           bco:designatesClass must be this class. Absent only
#                           for bco:FunctionalAdequacyAssessment, whose section
#                           4 row has no IRI ("representation open"), so the
#                           vocabulary has no record for it (D4-no-row); its
#                           label and definition are read from that row
#   concept_record_sha256   the concept's record digest (tools/vocab/build.py
#                           --digest), checked against the build
#   parent                  the one named parent. Checked against the section
#                           4 row's Parent cell, or, for the adequacy
#                           assessment, against the decision that chose it
#
# Per annotation property: its IRI, the label section 5's relation table
# gives it, and its use, which must be section 4's "Use" cell verbatim.

