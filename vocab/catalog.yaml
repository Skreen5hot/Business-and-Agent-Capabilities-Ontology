  - id: bcoc:BusinessModelGovernance
    pref_label:
      - {value: Business Model Governance, language: en}
    definition: >-
      A business capability, inhering in an organization, that is realized in
      planned acts by which that organization keeps its business models
      current, reviewing them against feedback and changing conditions and
      revising the models in use; acts that first establish this oversight
      develop the capability and are not, on that ground alone, realizations
